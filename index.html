<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Future Axis Investor Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fintech workspace — navy command bar with pill tabs, light card canvas below */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#f6f8fc; --ink:#0e1730; --muted:#5b6683; --line:#e3e8f2;
  --accent:#2f5bea; --accent-ink:#ffffff; --accent-soft:#e8eefe; --gold:#e0962a; --gold-soft:#fdf2e1;
  --pos:#0e9f6e; --neg:#dc3f34; --warn:#b97400;
  --nav:#0d1838; --nav-2:#16255a; --nav-ink:#ffffff; --nav-muted:#a9b4d6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --f-display:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 1px 2px rgba(14,23,48,.05), 0 6px 20px rgba(14,23,48,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#121a2e; --sunk:#0f1628; --ink:#e7ecf7; --muted:#97a3bf; --line:#24304d;
  --accent:#7090ff; --accent-ink:#0b1020; --accent-soft:#1c2a56; --gold:#f0b04f; --gold-soft:#3a2c12;
  --pos:#34d399; --neg:#f87171; --warn:#f5b748; --nav:#0a1124; --nav-2:#121c3d; --nav-ink:#ffffff; --nav-muted:#97a3c7;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121a2e; --sunk:#0f1628; --ink:#e7ecf7; --muted:#97a3bf; --line:#24304d;
  --accent:#7090ff; --accent-ink:#0b1020; --accent-soft:#1c2a56; --gold:#f0b04f; --gold-soft:#3a2c12;
  --pos:#34d399; --neg:#f87171; --warn:#f5b748; --nav:#0a1124; --nav-2:#121c3d; --nav-ink:#ffffff; --nav-muted:#97a3c7;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.authmode header.top{display:none}
body.authmode .auth{margin-top:12vh}
.auth .brandline{font:600 22px/1.2 var(--f-display);color:var(--ink)}
.hb{display:flex;flex-direction:column;gap:12px}
.hb-row{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-row .lab{min-width:0;display:flex;align-items:center;gap:8px}
.hb-row .lab .sw{flex:0 0 10px}
.hb-row .lab .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.grid4>*{min-width:0}
@media (max-width:760px){.grid4{grid-template-columns:1fr}}
.wide-svg{width:100%;height:auto;min-width:520px}
.hb-track{position:relative;height:14px;background:var(--sunk);border-radius:4px;display:flex;gap:2px;overflow:visible}
.hb-bar{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb-bar.first{border-radius:4px 0 0 4px}.hb-bar.only{border-radius:0 4px 4px 0}
.hb-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.hb-val{font:500 12px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:9ch}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:4px}
.keyrow span{display:inline-flex;align-items:center;gap:6px}
.keyrow .tick{width:2px;height:12px;background:var(--ink);display:inline-block}

img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font:600 20px/1.15 var(--f-display);letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.period label{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nowrap{white-space:nowrap}label.inl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}label.inl input,label.inl select{width:auto}
nav.tabs button{border:0;background:none;color:var(--muted);font:500 13.5px var(--f-body);padding:10px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .sep{width:1px;background:var(--line);margin:10px 6px}
main{padding-block:22px 60px}
h1{font:600 24px/1.2 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 17px/1.3 var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.stack{display:flex;flex-direction:column;gap:22px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.sheet-h{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.sheet-b{padding:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
th.n{font-family:var(--f-body)}
.neg{color:var(--neg)}.pos{color:var(--pos)}.mut{color:var(--muted)}
tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0;background:var(--sunk)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font:500 21px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.grid2>*{min-width:0}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);border-color:var(--neg);color:var(--surface)}
.btn.sm{padding:4px 9px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 35%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.bad{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.pill.inv{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);min-width:90px}
.split i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:0}
.legend div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px}
.chartbox{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.chartbox svg{max-width:100%;height:auto}
svg text{fill:var(--muted);font:11px var(--f-body)}
.note{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:6px;background:var(--gold-soft);color:var(--ink);font-size:13px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 15px var(--f-display);margin-bottom:4px}
.fs td:first-child{padding-left:12px}
.fs tr.sub td{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);font-weight:500}
.fs tr.ind td:first-child{padding-left:28px}
.fs tr.tot td{font-weight:600;border-top:1px solid var(--ink)}
.fs tr.gt td{font-weight:600;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
.chk{font-size:12px}
/* overlay form */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:flex-end;z-index:50}
.panel{background:var(--surface);width:min(480px,100%);height:100%;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.form textarea{min-height:64px;resize:vertical}
.err{color:var(--neg);font-size:12.5px;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:60}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters>*{flex:1 1 150px}
@media (max-width:560px){.form{grid-template-columns:1fr}.kpi .v{font-size:18px}h1{font-size:21px}}
@media (prefers-reduced-motion:no-preference){tr.click td{transition:background .12s}}

.auth{max-width:400px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.auth .sheet-b{display:flex;flex-direction:column;gap:12px}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0;text-align:left}
.who{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.ok-msg{color:var(--pos);font-size:12.5px;min-height:1em}

/* ---- modern skin ---- */
body{font-feature-settings:"tnum" 1, "cv11" 1;-webkit-font-smoothing:antialiased}
.n,.kpi .v,.hb-val{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{background:linear-gradient(120deg,var(--nav) 0%,var(--nav-2) 100%);border-bottom:0;color:var(--nav-ink);box-shadow:0 2px 12px rgba(13,24,56,.18)}
header.top .brand b{color:var(--nav-ink);font:800 19px/1.15 var(--f-display);letter-spacing:-.02em}
header.top .brand span{color:var(--nav-muted)}
header.top .period label, header.top .note, header.top .who, header.top .period .mut{color:var(--nav-muted)}
header.top input, header.top select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--nav-ink);color-scheme:dark;border-radius:10px}
header.top select option{color:#0e1730;background:#fff}
header.top .btn{background:rgba(255,255,255,.06);color:var(--nav-ink);border-color:rgba(255,255,255,.22)}
header.top .btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
nav.tabs{gap:4px;padding-bottom:12px}
nav.tabs button{color:var(--nav-muted);border:0;border-bottom:0;border-radius:999px;padding:7px 9px;font:600 13px var(--f-body)}
nav.tabs button:hover{color:var(--nav-ink);background:rgba(255,255,255,.08)}
nav.tabs button[aria-selected="true"]{background:var(--nav-ink);color:var(--nav);box-shadow:0 2px 8px rgba(0,0,0,.18)}
nav.tabs .sep{background:rgba(255,255,255,.16);margin:8px 4px}
main{padding-block:28px 64px}
h1{font:800 28px/1.15 var(--f-display);letter-spacing:-.025em}
h2{font:700 16px/1.3 var(--f-display);letter-spacing:-.01em}
.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.09em}
.sheet{border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.sheet-h{padding:16px 20px}
.sheet-b{padding:18px 20px}
th{background:transparent;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.07em}
td{border-bottom-color:var(--line)}
tr.click:hover td{background:var(--accent-soft)}
.kpis{gap:12px;background:transparent;border:0;border-radius:0;overflow:visible}
.kpi{border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;gap:6px}
.kpi .eyebrow{color:var(--muted);font-weight:600;font-size:11px}
.kpi .v{font:800 23px/1.15 var(--f-num);letter-spacing:-.02em}
.sheet .kpis{padding:16px 20px}
.sheet .kpis .kpi{box-shadow:none;background:var(--sunk)}
.btn{border-radius:10px;font:600 13px var(--f-body);padding:8px 14px;transition:background .15s,border-color .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{border-radius:8px;padding:5px 10px}
input,select,textarea{border-radius:10px;padding:8px 10px;background:var(--surface)}
.pill{border-radius:999px;font-weight:600;padding:2px 9px}
.pill.ok{background:color-mix(in srgb,var(--pos) 12%,transparent);border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--neg) 12%,transparent);border-color:transparent}
.pill.inv{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:transparent}
.banner{border-radius:12px}
.panel{border-radius:18px 0 0 18px;box-shadow:-12px 0 40px rgba(14,23,48,.18)}
.ov{backdrop-filter:blur(3px)}
.toast{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
body.authmode{background:radial-gradient(900px 500px at 15% -10%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 70%), radial-gradient(700px 500px at 100% 100%, color-mix(in srgb,var(--gold) 16%,transparent), transparent 70%), var(--bg)}
.auth .brandline{font:800 26px/1.15 var(--f-display);letter-spacing:-.02em}
.auth form.sheet{border-radius:18px}
@media (max-width:560px){.kpi .v{font-size:19px} h1{font-size:23px}}
/* interactive charts */
.tip{position:fixed;z-index:80;pointer-events:none;min-width:190px;max-width:300px;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(14,23,48,.28);font-size:12.5px;line-height:1.45}
.tip .tt{font-weight:700;margin-bottom:6px;font-size:13px}
.tip .tr{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:1px 0}
.tip .tr b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.tip .tr i{width:10px;height:10px;border-radius:3px}
.tip .tf{margin-top:6px;opacity:.7;font-size:11.5px}
[data-tip]{cursor:pointer;outline:none}
[data-tip]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[data-chart] [data-k]{transition:opacity .15s ease}
[data-chart].on [data-k]:not(.hi){opacity:.32}
[data-chart].on .hit[data-k]{opacity:1}
.chartbox svg .seg{transform-box:view-box;transform-origin:100px 100px;transition:transform .15s ease,opacity .15s ease}
.chartbox svg .seg.hi{transform:scale(1.045)}
.chartbox .dc-l{font-size:10.5px;fill:var(--muted)}
.chartbox .dc-v{font:800 17px var(--f-num);fill:var(--ink)}
.chartbox .dc-p{font:600 11px var(--f-num);fill:var(--muted)}
.chartbox .legend div{grid-template-columns:10px 1fr auto 56px;padding:5px 8px;border-radius:8px}
.chartbox .legend div.hi,.chartbox .legend div:hover{background:var(--sunk)}
.chartbox .legend .lp{color:var(--muted)}
.hb.ix .hb-row{padding:4px 6px;margin:-4px -6px;border-radius:8px}
.hb.ix .hb-row.hi{background:var(--sunk)}
.mchart .hit{fill:var(--ink);fill-opacity:0}
.mchart .hit.hi,.mchart .hit:hover{fill-opacity:.05}
.mchart .bl{font:700 11px var(--f-num);fill:var(--ink)}
.mchart text{font-size:11.5px;fill:var(--muted)}
.mchart .col rect:last-child{rx:3px}
.comp-bar{display:flex;gap:3px;height:16px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.comp-bar i{display:block;min-width:4px}
.comp .keyrow{margin-top:10px}
.comp .keyrow span.hi b{color:var(--ink)}
/* KPI cards */
.kpi.kx{position:relative;overflow:hidden}
.kpi.kx::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--kc)}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .kic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);flex:0 0 30px}
.kpi .spark{margin-top:4px;max-width:100%}
.sheet .kpis .kpi.kx::before{width:3px}
/* recommendations */
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;padding:16px 20px 20px}
.rec{display:flex;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);--rc:var(--accent)}
.rec.high{--rc:var(--neg)}.rec.med{--rc:var(--warn)}.rec.info{--rc:var(--accent)}.rec.good{--rc:var(--pos)}
.rec{background:color-mix(in srgb,var(--rc) 6%,var(--surface));border-color:color-mix(in srgb,var(--rc) 22%,var(--line))}
.rec .ri{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--rc);font-size:14px}
.rec .rb{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.rec .rb b{font-size:14px;line-height:1.3}
.rec .rb p{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
/* alerts */
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:16px;border:1px solid var(--line);background:var(--surface);font-size:13px;box-shadow:var(--shadow)}
.alert>div{flex:1;min-width:0}
.alert .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--accent)}
.alert.ok .dot{background:var(--pos)}.alert.warn .dot{background:var(--warn)}.alert.bad .dot{background:var(--neg)}
.alert.bad{border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}.alert.warn{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
@media (max-width:560px){.recs{padding:12px}.alert{flex-wrap:wrap}}

/* segmented control, investors, receipts, month tables */
.segctl{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:18px}
.segctl button{border:0;background:none;padding:7px 14px;border-radius:9px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.segctl button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
tr.selrow td{background:var(--accent-soft)}
.ivbar{border-bottom:1px solid var(--line)}
.ivbar button:disabled,.ivbar select:disabled{opacity:.5;cursor:not-allowed}
.cbox{min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px;background:var(--surface);overflow-x:auto}
.cbox h3{margin:0 0 8px;font-size:13.5px}
.keyrow .ln{width:16px;height:3px;border-radius:2px;display:inline-block}
.mchart .adot{opacity:0!important}.mchart .adot.hi{opacity:1!important}
.mtbl{overflow-x:auto}
.mtbl table{min-width:max-content}
.mtbl th:first-child,.mtbl td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:260px;box-shadow:1px 0 0 var(--line)}
.mtbl tr.sub td:first-child{background:var(--surface)}
.mtbl .tc{background:var(--sunk);font-weight:700}
.rfield{display:flex;flex-direction:column;gap:6px}
.rfield .lbl,.form .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.rcpts{display:flex;flex-direction:column;gap:6px}
.rcpt{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);flex-wrap:wrap}
.rcpt.rm{opacity:.5}.rcpt.rm .lnk{text-decoration:line-through}
.lnk{border:0;background:none;padding:0;color:var(--accent);font:600 13px var(--f-body);cursor:pointer;text-align:left}
.rbadge{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 11px var(--f-num);cursor:pointer;vertical-align:middle}
.rbadge:hover{background:var(--accent-soft)}

tr.dim td{opacity:.55}
.segctl .cnt{font:700 11px var(--f-num);opacity:.75;margin-left:2px}
.segctl{flex-wrap:wrap}

.form .chkl{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:600}.form .chkl input{width:auto}

.fxgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fxcard{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.fxcard .v{font:800 16px var(--f-num)}
.fxres{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:15px}
</style>
</head>
<body class="authmode">

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><b id="entityName">Future Axis Holdings</b><span>Investor &amp; venture ledger</span></div>
      <div class="row" style="gap:16px">
      <div class="period" id="periodBar" hidden>
        <label for="pPreset">Period</label>
        <select id="pPreset">
          <option value="ytd">Year to date</option>
          <option value="lq">Last full quarter</option>
          <option value="lm">Last full month</option>
          <option value="l12">Last 12 months</option>
          <option value="itd">Inception to date</option>
          <option value="custom">Custom</option>
        </select>
        <input type="date" id="pStart" aria-label="Period start">
        <span class="mut">to</span>
        <input type="date" id="pEnd" aria-label="Period end">
      </div>
      <label class="period" id="curBar" hidden><span class="note">Show in</span><select id="viewCur" aria-label="Display currency"></select></label>
      <div class="who" id="who" hidden><span id="whoEmail"></span><button class="btn sm" id="signOut" type="button">Sign out</button></div>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" hidden></nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty"><b>Opening the ledger</b>Connecting to the database…</div>
</main>
<div id="ovHost"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
const PAY_CURS = ["USD","AED","PKR","GBP","EUR","SAR","Other"];
const EXP_CATS = ["Supplier / service provider","Salaries & staff","Bank charges","Software & subscriptions","Travel","Legal & professional","Office & admin","Other"];
/* ---------- constants ---------- */
const TYPES = {
  "Owner Capital Contribution": {cash:1, owner:1},
  "Owner Drawing":              {cash:-1, owner:-1},
  "Investment Addition":        {cash:-1, inv:1},
  "Investment Withdrawal":      {cash:1, inv:-1},
  "Profit Accrued":             {rec:1, inc:1},
  "Profit Received":            {cash:1, rec:-1},
  "Investor Profit Accrued":    {pay:1, share:1},
  "Investor Profit Paid":       {cash:-1, pay:-1},
  "Investor Capital Repaid":    {cash:-1, icap:-1},
  "Operating Expense":          {cash:-1, opex:1},
  "Other Income":               {cash:1, oinc:1}
};
const INV_TYPES = ["Investor Profit Accrued","Investor Profit Paid","Investor Capital Repaid"];
const VEN_TYPES = ["Investment Addition","Investment Withdrawal","Profit Accrued","Profit Received"];
const TABS = [["dashboard","Dashboard"],["portfolio","Portfolio"],["investors","Investors"],["ventures","Ventures"],["statements","Statements"],["capital","Share capital"],["master","Master data"],["|"],["ledger","Ledger"],["bank","Bank"],["expenses","Expenses"],["|"],["returns","Returns"],["monthly","Monthly"],["reports","Reports"],["|"],["settings","Settings"]];
const MODES = ["Mudarabah","Musharakah","Equity","Loan","Profit participation","Other"];
const METHODS = ["Bank transfer","Cash","Cheque","Profit adjustment","Card","Other"];
const isCashType = t => !!(TYPES[t]||{}).cash;
/* ---- currencies: data is stored in the base currency; the screen shows the chosen view currency ---- */
const CURS = ["USD","AED"];
const BASE = () => String(S.cfg.base || "USD").toUpperCase();
const PER_USD = () => ({USD:1, AED: num(S.cfg.aedRate) || 3.6725});
const conv = (v, from, to) => { const r = PER_USD(); return num(v) / (r[from] || 1) * (r[to] || 1); };
const VIEW = () => String(S.view || S.cfg.view || BASE()).toUpperCase();
const VX = () => conv(1, BASE(), VIEW());
const MONEY_FIELDS = {ledger:["amount","ownPart"], placements:["amount"]};
function scaleDoc(col, d, f){ const ks = MONEY_FIELDS[col]; if (!ks) return d; const o = {...d}; for (const k of ks) if (o[k]!=="" && o[k]!=null && isFinite(+o[k])) o[k] = +o[k] * f; return o; }
const COLS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)","var(--c8)"];
/* a venture keeps the same colour everywhere, set by its position in the register */
const vcol = id => { const i = S.biz.findIndex(b=>b.id===id); return i<0 ? "var(--muted)" : COLS[i % COLS.length]; };
const ORIGIN = "0000-01-01";

const S = {biz:[], pl:[], led:[], bank:[], bl:[], sh:[], sup:[], inv:[], raw:null, view:"", bankSel:"", blf:"all", imp:null, cfg:{entity:"Future Axis Holdings", currency:"AED"},
  loaded:{biz:false,pl:false,led:false}, db:null, dl:null, canWrite:null, tab:"dashboard",
  start:"", end:"", preset:"ytd", lf:{biz:"",type:"",q:""}, year:null, csv:{}};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const nf = new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
function money(v){ const r = Math.round(v); if (r === 0) return '<span class="mut">–</span>'; return r < 0 ? `<span class="neg">(${nf.format(-r)})</span>` : nf.format(r); }
function pct(v, d=1){ if (!isFinite(v) || Math.abs(v) < 1e-9) return '<span class="mut">–</span>'; const s=(Math.abs(v)*100).toFixed(d)+"%"; return v<0?`<span class="neg">(${s})</span>`:s; }
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date());
const D = s => new Date(s+"T00:00:00");
const addDays = (s,n) => { const d = D(s); d.setDate(d.getDate()+n); return iso(d); };
const days = (a,b) => Math.round((D(b)-D(a))/864e5);
const fmtDate = s => s ? D(s).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "";
const div = (a,b) => b ? a/b : 0;
const bizName = id => id ? (S.biz.find(b=>b.id===id)?.name || "Unknown venture") : "Future Axis (HQ)";
const bizCode = id => id ? (S.biz.find(b=>b.id===id)?.code || "?") : "HQ";
const bankCode = id => S.bank.find(a=>a.id===id)?.code || "";
const bankName = id => { const a = S.bank.find(x=>x.id===id); return a ? `${a.code} · ${a.name}` : ""; };
const plLabel = id => { const p = S.pl.find(x=>x.id===id); return p ? `${p.code||""} · ${p.investor}` : ""; };
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

/* ---------- period ---------- */
function applyPreset(p){
  const t = D(todayIso()); let s, e;
  if (p==="ytd"){ s = `${t.getFullYear()}-01-01`; e = todayIso(); }
  else if (p==="lm"){ const a = new Date(t.getFullYear(), t.getMonth()-1, 1); s = iso(a); e = iso(new Date(t.getFullYear(), t.getMonth(), 0)); }
  else if (p==="lq"){ const q = Math.floor(t.getMonth()/3); const a = new Date(t.getFullYear(), q*3-3, 1); s = iso(a); e = iso(new Date(a.getFullYear(), a.getMonth()+3, 0)); }
  else if (p==="l12"){ e = todayIso(); s = addDays(iso(new Date(t.getFullYear()-1, t.getMonth(), t.getDate())),1); }
  else if (p==="itd"){ const ds = [...S.led.map(x=>x.date), ...S.pl.map(x=>x.date)].filter(Boolean).sort(); s = ds[0] || `${t.getFullYear()}-01-01`; e = todayIso(); }
  else return;
  S.start = s; S.end = e;
}
function initPeriod(){
  S.preset = store.get("fa.preset") || "ytd";
  if (S.preset === "custom"){ S.start = store.get("fa.start") || ""; S.end = store.get("fa.end") || ""; }
  if (!S.start || !S.end){ if (S.preset==="custom") S.preset="ytd"; applyPreset(S.preset); }
  syncPeriodInputs();
  $("#pPreset").onchange = e => { S.preset = e.target.value; store.set("fa.preset", S.preset); if (S.preset!=="custom") applyPreset(S.preset); syncPeriodInputs(); render(); };
  const onDate = () => { const a=$("#pStart").value, b=$("#pEnd").value; if (!a||!b||a>b) return; S.start=a; S.end=b; S.preset="custom"; store.set("fa.preset","custom"); store.set("fa.start",a); store.set("fa.end",b); $("#pPreset").value="custom"; render(); };
  $("#pStart").onchange = onDate; $("#pEnd").onchange = onDate;
}
function syncPeriodInputs(){ $("#pPreset").value = S.preset; $("#pStart").value = S.start; $("#pEnd").value = S.end; }

/* ---------- accounting engine ---------- */
const eff = (t,k) => (TYPES[t.type]||{})[k] || 0;
function bal(k, upto, f){ let s=0; for (const t of S.led) if (t.date && t.date<=upto && (!f||f(t))) s += num(t.amount)*eff(t,k); return s; }
function flow(k, from, to, f){ let s=0; for (const t of S.led) if (t.date>=from && t.date<=to && (!f||f(t))) s += num(t.amount)*eff(t,k); return s; }
function tsum(type, from, to, f){ let s=0; for (const t of S.led) if (t.type===type && t.date>=from && t.date<=to && (!f||f(t))) s += num(t.amount); return s; }
function placed(from, to, f){ let s=0; for (const p of S.pl) if (p.date && p.date>=from && p.date<=to && (!f||f(p))) s += num(p.amount); return s; }

function balanceSheet(d){
  const cash = bal("cash",d) + placed(ORIGIN,d);
  const inv = bal("inv",d), rec = bal("rec",d);
  const icap = placed(ORIGIN,d) + bal("icap",d), pay = bal("pay",d);
  const owner = bal("owner",d), re = bal("inc",d) - bal("share",d) - bal("opex",d) + bal("oinc",d);
  const assets = cash+inv+rec, liab = icap+pay, eq = owner+re;
  return {cash,inv,rec,assets,icap,pay,liab,owner,re,eq,le:liab+eq,diff:assets-liab-eq};
}
function pnl(from,to){
  const inc = flow("inc",from,to), share = flow("share",from,to), opex = flow("opex",from,to), oinc = flow("oinc",from,to);
  return {inc, share, spread:inc-share, oinc, opex, net:inc-share+oinc-opex};
}
function investorReturns(){
  const {start,end} = S;
  return S.pl.map(p => {
    const f = t => t.placementId===p.id;
    const active = p.date && p.date<=end;
    const stop = p.maturity && p.maturity<end ? p.maturity : end;
    const d = active ? Math.max(0, days(p.date, stop)) : 0;
    const expected = num(p.amount)*num(p.rate)*d/365;
    const accrued = tsum("Investor Profit Accrued",ORIGIN,end,f), paid = tsum("Investor Profit Paid",ORIGIN,end,f);
    const periodAcc = tsum("Investor Profit Accrued",start,end,f);
    const repaid = tsum("Investor Capital Repaid",ORIGIN,end,f);
    const out = (active?num(p.amount):0) - repaid;
    return {p, d, expected, accrued, paid, payable:accrued-paid, periodAcc, repaid, out, varr:expected-accrued, ann: d ? div(accrued,num(p.amount))*365/d : 0};
  });
}
/* ---------- table + csv ---------- */
function csvReg(key, head, rows){ S.csv[key] = {head, rows}; }
async function downloadCsv(key){
  const t = S.csv[key]; if (!t) return;
  if (!S.dl){ toast("Downloads are not available in this view"); return; }
  const esc = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const body = [t.head, ...t.rows].map(r => r.map(esc).join(",")).join("\n");
  try { await S.dl.save({filename:`future-axis-${key}-${S.end}.csv`, data:"﻿"+body}); toast("CSV saved"); }
  catch(e){ if (e && e.code!=="declined") toast("Download unavailable: "+(e.message||e.code)); }
}
const csvBtn = key => S.dl ? `<button class="btn sm" data-csv="${key}">Download CSV</button>` : "";
const r0 = v => Math.round(v);
const p2 = v => (v*100).toFixed(2)+"%";

/* ---------- charts (interactive: hover, focus or tap shows figures and %) ---------- */
const cur0 = () => VIEW();
const fmtV = v => `${cur0()} ${nf.format(Math.round(v))}`;
const pc1 = v => isFinite(v) ? (v*100).toFixed(1) + "%" : "–";
/* data-tip carries {t:title, r:[[label, value, colour]], f:footnote} */
const tipData = (t, r, f) => ` data-tip="${h(JSON.stringify({t, r, f: f || ""}))}" tabindex="0"`;
let chartSeq = 0;
function donut(items, opt={}){
  const tot = items.reduce((s,x)=>s+Math.max(0,x.v),0);
  if (!tot) return `<p class="note">${opt.empty || "Nothing to show for this period yet."}</p>`;
  const id = "d" + (++chartSeq), R=92, r=62, cx=100, cy=100, gap = items.filter(x=>x.v>0).length > 1 ? 0.012 : 0;
  let a = -Math.PI/2, paths = "";
  const ctr = opt.fmt ? opt.fmt(tot) : nf.format(Math.round(tot));
  items.forEach((x,i) => {
    const v = Math.max(0,x.v); if (!v) return;
    const share = v/tot, sweep = share*Math.PI*2, a1 = a + gap, a2 = a + sweep - gap, large = (a2-a1)>Math.PI?1:0;
    const p = (ang,rad)=>[cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)].map(n=>n.toFixed(2)).join(",");
    const tip = tipData(x.l, [["Amount", fmtV(v), x.c], ["Share", pc1(share)], ...(x.extra||[])], opt.foot);
    const attrs = `class="seg" data-k="${id}-${i}" data-cl="${h(x.l)}" data-cv="${h(opt.fmt?opt.fmt(v):nf.format(Math.round(v)))}" data-cp="${pc1(share)}"${tip}`;
    if (sweep >= Math.PI*2-0.001) paths += `<circle ${attrs} cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${x.c}" stroke-width="${R-r}"></circle>`;
    else paths += `<path ${attrs} d="M${p(a1,R)} A${R},${R} 0 ${large} 1 ${p(a2,R)} L${p(a2,r)} A${r},${r} 0 ${large} 0 ${p(a1,r)} Z" fill="${x.c}"></path>`;
    a += sweep;
  });
  const leg = items.map((x,i)=> x.v>0 ? `<div data-k="${id}-${i}"${tipData(x.l, [["Amount", fmtV(x.v), x.c], ["Share", pc1(x.v/tot)], ...(x.extra||[])], opt.foot)}><i class="sw" style="background:${x.c}"></i><span class="lt">${h(x.l)}</span><span class="n">${opt.fmt?opt.fmt(x.v):nf.format(Math.round(x.v))}</span><span class="n lp">${pc1(x.v/tot)}</span></div>` : "").join("");
  return `<div class="chartbox ix" data-chart><svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="${h(opt.aria||"Breakdown")}">${paths}
    <text class="dc-l" x="100" y="86" text-anchor="middle" data-0="${h(opt.center||"Total")}">${h(opt.center||"Total")}</text>
    <text class="dc-v" x="100" y="108" text-anchor="middle" data-0="${h(ctr)}">${h(ctr)}</text>
    <text class="dc-p" x="100" y="126" text-anchor="middle" data-0="100%">100%</text></svg>
    <div class="legend" style="flex:1 1 190px">${leg}</div></div>`;
}
const kfmt = v => Math.abs(v)>=1e6 ? (v/1e6).toFixed(2)+"m" : Math.abs(v)>=1e3 ? nf.format(Math.round(v/1000))+"k" : nf.format(Math.round(v));
/* horizontal bars, optional reference tick (e.g. expected rate) */
function hbars(rows, opt={}){
  if (!rows.length) return `<p class="note">${opt.empty || "Nothing to show for this period yet."}</p>`;
  const id = "h" + (++chartSeq), mx = Math.max(...rows.map(r=>Math.max(r.v, r.mark ?? 0)), 0) || 1;
  const sc = v => Math.max(0, v)/mx*100;
  return `<div class="hb ix" data-chart role="list">${rows.map((r,i)=>`<div class="hb-row" role="listitem" data-k="${id}-${i}"${tipData(r.l, r.tipRows || [["Value", r.lab, r.c]])}>
    <span class="lab"><i class="sw" style="background:${r.c}"></i><span class="t">${h(r.l)}</span></span>
    <span class="hb-track"><i class="hb-bar only" style="width:${sc(r.v)}%;background:${r.c}"></i>${r.mark!=null?`<i class="hb-mark" style="left:calc(${sc(r.mark)}% - 1px)"></i>`:""}</span>
    <span class="hb-val">${r.lab}</span></div>`).join("")}</div>${opt.key||""}`;
}
/* stacked horizontal bars: own vs investor capital */
function stackbars(rows){
  if (!rows.length) return `<p class="note">No capital invested yet.</p>`;
  const id = "s" + (++chartSeq), mx = Math.max(...rows.map(r=>r.a+r.b), 0) || 1;
  return `<div class="hb ix" data-chart>${rows.map((r,i)=>{ const t = r.a+r.b, wa=Math.max(0,r.a)/mx*100, wb=Math.max(0,r.b)/mx*100;
    return `<div class="hb-row" data-k="${id}-${i}"${tipData(r.l, [["Own investment", `${fmtV(r.a)} · ${pc1(div(r.a,t))}`, "var(--accent)"], ["Investor capital", `${fmtV(r.b)} · ${pc1(div(r.b,t))}`, "var(--gold)"], ["Total deployed", fmtV(t)]])}>
    <span class="lab"><i class="sw" style="background:${r.c}"></i><span class="t">${h(r.l)}</span></span>
    <span class="hb-track" style="background:none">${wa?`<i class="hb-bar ${wb?"first":"only"}" style="width:${wa}%;background:var(--accent)"></i>`:""}${wb?`<i class="hb-bar" style="width:${wb}%;background:var(--gold)"></i>`:""}</span>
    <span class="hb-val">${kfmt(t)}</span></div>`; }).join("")}</div>
    <div class="keyrow"><span><i class="sw" style="background:var(--accent)"></i>Own investment</span><span><i class="sw" style="background:var(--gold)"></i>Investor capital</span></div>`;
}
/* one horizontal bar split into parts (e.g. net profit by source) */
function compBar(parts){
  const pos = parts.filter(p=>p.v>0), tot = pos.reduce((s,p)=>s+p.v,0); if (!tot) return "";
  const id = "c" + (++chartSeq), net = parts.reduce((s,p)=>s+p.v,0);
  return `<div class="comp ix" data-chart><div class="comp-bar">${pos.map((p,i)=>`<i data-k="${id}-${i}" style="flex:${p.v} 1 0;background:${p.c}"${tipData(p.l, [["Amount", fmtV(p.v), p.c], ["Share of positive profit", pc1(p.v/tot)], ["Share of net profit", pc1(div(p.v,net))]])}></i>`).join("")}</div>
    <div class="keyrow">${pos.map((p,i)=>`<span data-k="${id}-${i}"><i class="sw" style="background:${p.c}"></i>${h(p.l)} · <b>${pc1(p.v/tot)}</b></span>`).join("")}</div></div>`;
}

function bars(months){

      [...S3.map(([k,l,c])=>[l, fmtV(m[k]||0), c]), ["Net profit", fmtV(m.net)], ["Share of year", pc1(div(m.net, yt))], ["Year to date", fmtV(m.cum)]], m.net ? "" : "Nothing recorded for this month")}/>`;

/* tooltip engine (one floating box for every chart) */
(function(){
  let tip = null, cur = null, pinned = false;
  const box = () => tip || (tip = Object.assign(document.body.appendChild(document.createElement("div")), {className:"tip", hidden:true, role:"tooltip"}));
  function hl(el, on){
    const c = el.closest("[data-chart]"); if (!c) return;
    c.classList.toggle("on", on); c.querySelectorAll(".hi").forEach(x=>x.classList.remove("hi"));
    if (on && el.dataset.k) c.querySelectorAll(`[data-k="${el.dataset.k}"]`).forEach(x=>x.classList.add("hi"));
    const seg = on && el.dataset.k ? c.querySelector(`.seg[data-k="${el.dataset.k}"]`) : null;
    for (const [cls, key] of [["dc-l","cl"],["dc-v","cv"],["dc-p","cp"]]){ const t = c.querySelector("."+cls); if (t) t.textContent = seg ? seg.dataset[key] : t.dataset[0]; }
  }
  function place(x, y){ const b = box(), w = b.offsetWidth, hh = b.offsetHeight, vw = innerWidth, vh = innerHeight;
    let L = x + 14, T = y + 14; if (L + w > vw - 8) L = x - w - 14; if (T + hh > vh - 8) T = y - hh - 14; b.style.left = Math.max(8, L) + "px"; b.style.top = Math.max(8, T) + "px"; }
  function show(el, x, y){
    let d; try { d = JSON.parse(el.dataset.tip); } catch(e){ return; }
    if (cur && cur !== el) hl(cur, false); cur = el; hl(el, true);
    const b = box(); b.innerHTML = `<div class="tt">${h(d.t)}</div>${(d.r||[]).map(r=>`<div class="tr">${r[2]?`<i class="sw" style="background:${r[2]}"></i>`:"<i></i>"}<span>${h(r[0])}</span><b>${h(r[1])}</b></div>`).join("")}${d.f?`<div class="tf">${h(d.f)}</div>`:""}${pinned?'<div class="tf">Tap elsewhere to close</div>':""}`;
    b.hidden = false; if (x == null){ const r = el.getBoundingClientRect(); x = r.left + r.width/2; y = r.top + r.height/2; } place(x, y);
  }
  function hide(){ if (cur) hl(cur, false); cur = null; pinned = false; if (tip) tip.hidden = true; }
  document.addEventListener("pointerover", e => { if (pinned || e.pointerType === "touch") return; const el = e.target.closest?.("[data-tip]"); if (el) show(el, e.clientX, e.clientY); });
  document.addEventListener("pointermove", e => { if (!pinned && cur && e.pointerType !== "touch") place(e.clientX, e.clientY); });
  document.addEventListener("pointerout", e => { if (pinned || !cur) return; const to = e.relatedTarget; if (!to || !cur.contains(to) && to.closest?.("[data-tip]") !== cur) hide(); });
  document.addEventListener("click", e => { const el = e.target.closest?.("[data-tip]"); if (el){ pinned = true; show(el, e.clientX, e.clientY); } else if (pinned) hide(); });
  document.addEventListener("focusin", e => { const el = e.target.closest?.("[data-tip]"); if (el && !pinned) show(el); });
  document.addEventListener("focusout", e => { if (!pinned && cur && e.target === cur) hide(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
  addEventListener("scroll", () => { if (!cur) return; if (!document.contains(cur)) return hide(); const r = cur.getBoundingClientRect(); place(r.left + r.width/2, r.top + r.height/2); }, {passive:true});
  window.hideTip = hide;
})();

/* time-weighted capital: amount × days held inside [from, to] */
function capDays(entries, from, to){
  let s = 0; const f0 = addDays(from, -1);
  for (const [d, a] of entries) if (d && d <= to) s += a * Math.max(0, days(d < f0 ? f0 : d, to));
  return s;
}
const lastAccrual = (from, to, f) => S.led.reduce((m,t) => t.type==="Profit Accrued" && t.date>=from && t.date<=to && (!f||f(t)) && t.date>m ? t.date : m, "");

function monthly(year){
  const out=[]; let cum=0;
  for (let m=1;m<=12;m++){
    const from = `${year}-${pad(m)}-01`, to = iso(new Date(year, m, 0));
    const P = pnl(from,to); cum += P.net; const sp = incomeSplit(from, to), other = P.oinc - P.opex, own = sp.own;
    out.push({m, from, to, label:new Date(year,m-1,1).toLocaleDateString("en-GB",{month:"short"}), ...P, own, invNet: P.net - own - other, other, recd:tsum("Profit Received",from,to), cum});
  }
  return out;
}

/* ---------- views ---------- */
function ventureAccounts(){
  const {start, end} = S;
  return S.biz.map(b => {
    const f = t => t.bizId===b.id;
    const added = tsum("Investment Addition",ORIGIN,end,f), wd = tsum("Investment Withdrawal",ORIGIN,end,f), net = added-wd;
    const icap = placed(ORIGIN,end,p=>p.bizId===b.id) - tsum("Investor Capital Repaid",ORIGIN,end,f);
    const own = net - icap;
    const acc = tsum("Profit Accrued",start,end,f), recd = tsum("Profit Received",start,end,f), rec = bal("rec",end,f);
    const share = tsum("Investor Profit Accrued",start,end,f), pay = bal("pay",end,f);
    /* annualised on time-weighted capital, up to the last profit accrual in the period */
    const yEnd = lastAccrual(start, end, f) || end;
    const cd = capDays(S.led.filter(t=>f(t) && (t.type==="Investment Addition"||t.type==="Investment Withdrawal")).map(t=>[t.date, num(t.amount)*(t.type==="Investment Addition"?1:-1)]), start, yEnd);
    const yld = cd > 0 ? acc*365/cd : 0, avg = cd / (days(start, yEnd)+1);
    const pls = S.pl.filter(p=>p.bizId===b.id && p.date && p.date<=end), invRate = div(pls.reduce((s,p)=>s+num(p.amount)*num(p.rate),0), pls.reduce((s,p)=>s+num(p.amount),0));
    return {b, added, wd, net, icap, own, acc, recd, rec, share, pay, contrib:acc-share, yld, avg, invRate, varr: yld - num(b.rate)};
  });
}
function ratios(){
  const P = pnl(S.start,S.end), va = ventureAccounts(), pd = days(S.start,S.end)+1;
  const T = va.reduce((s,x)=>s+x.net,0), K = va.reduce((s,x)=>s+x.icap,0), O = T-K;
  const sp = incomeSplit(S.start, S.end), incOwn = sp.own, incInv = sp.inv;
  const netOwn = incOwn + P.oinc - P.opex, netInv = incInv - P.share;
  /* average capital over the earning window (period start to the last profit accrual) */
  const aEnd = lastAccrual(S.start, S.end) || S.end, ad = days(S.start, aEnd)+1;
  const Tavg = capDays(S.led.filter(t=>t.type==="Investment Addition"||t.type==="Investment Withdrawal").map(t=>[t.date, num(t.amount)*(t.type==="Investment Addition"?1:-1)]), S.start, aEnd)/ad;
  const Kavg = capDays([...S.pl.map(p=>[p.date, num(p.amount)]), ...S.led.filter(t=>t.type==="Investor Capital Repaid").map(t=>[t.date, -num(t.amount)])], S.start, aEnd)/ad;
  const Oavg = Tavg - Kavg, an = 365/ad;
  return {P, T, K, O, Tavg, Kavg, Oavg, aEnd, ad, incOwn, incInv, netOwn, netInv, pd, an,
    npr: div(P.net,P.inc), nprOwn: div(netOwn,Oavg), nprInv: div(netInv,Kavg), invRet: div(P.share,Kavg), roc: div(P.net,Tavg)};
}

/* ---------- recommendations: 3–4 most important, from the numbers ---------- */
function recommendations(R, va, bs){

    out.push({s:100, sev:"high", title:`Post profit for ${monthLabel(lastYm)}`, text:`No venture or investor profit is posted for ${monthLabel(lastYm)} yet, so profit, investor payables and the monthly investor report are understated.`, btn:`<button class="btn sm primary" data-acc="1">Run profit accruals</button>`});

  // 3. collections

  if (!out.some(x=>x.title.startsWith("Cash")) && bs.rec > 1 && acc > 0 && recd/acc < 0.25)
    out.push({s:70, sev:"med", title:"Collect profit from ventures", text:`${F(bs.rec)} of profit is receivable and only ${pc1(recd/acc)} of this period's profit has been received. Largest balance: ${topRec.b.name} (${F(topRec.rec)}).`, go:"ledger", act:"Open Ledger"});

  // 5. margin between venture rate and investor rate
  const sp = live.filter(x=>x.icap>1).map(x=>({x, spread:num(x.b.rate)-x.invRate})).sort((a,b)=>a.spread-b.spread);
  const best = [...sp].sort((a,b)=>b.spread-a.spread)[0];
  if (sp.length && sp[0].spread < 0.03){ const w = sp[0];
    out.push({s: w.spread < 0 ? 95 : 75, sev: w.spread < 0 ? "high" : "med", title: w.spread < 0 ? `Investors in ${w.x.b.name} cost more than it earns` : `Thin margin on ${w.x.b.name}`,
      text:`Investors there are on ${pc1(w.x.invRate)} on average against an expected ${pc1(num(w.x.b.rate))}: a ${pp(w.spread)} pt spread, about ${F(w.x.icap*w.spread)} a year.${best && best.x!==w.x && best.spread>w.spread ? ` Direct new money to ${best.x.b.name} (${pp(best.spread)} pt spread) or price new placements lower.` : " Price new placements lower."}`, go:"investors", act:"Review rates"}); }
  else if (best && best.spread > 0) out.push({s:40, sev:"good", title:`Best margin: ${best.x.b.name}`, text:`It is expected to earn ${pc1(num(best.x.b.rate))} against ${pc1(best.x.invRate)} agreed with investors, a ${pp(best.spread)} pt spread. Each ${VIEW()} 100k of new investor money placed there adds about ${F(100000*best.spread)} a year.`, go:"ventures", act:"Open Ventures"});
  // 6. concentration

  // 7. ventures earning below expectation
  const under = live.filter(x=>x.acc>0 && x.yld < num(x.b.rate) - 0.02).sort((a,b)=>a.varr-b.varr)[0];

    ${k("Net profit",money(R.P.net),`on income of ${nf.format(R.P.inc)}`,"profit","var(--pos)",netTip, spark(moTo.map(m=>m.net), "var(--pos)"))}
    ${k("Profit receivable",money(bs.rec),"due from ventures","rec","var(--c2)")}
    ${k("Cash",money(bs.cash),`investor profit payable ${nf.format(bs.pay)}`,"cash","var(--c3)")}
  </div>
  ${recCards(recommendations(R, va, bs))}
  <section class="sheet"><div class="sheet-h"><div><h2>Profit by source</h2><p>${fmtDate(S.start)} to ${fmtDate(S.end)} · venture profit split by whose capital earned it, day by day</p></div><div class="row">${S.canWrite!==false?'<button class="btn sm" data-acc="1">Run profit accruals</button>':""}<button class="btn sm" data-go="capital">Share capital</button></div></div>

    <div class="kpis" style="border:0;border-radius:0">
      ${k("Profit from paid-up capital", money(R.incOwn), `on ${nf.format(R.O)} own capital · ${pct(div(R.incOwn,R.Oavg)*R.an)} p.a.`, "own", "var(--accent)")}
      ${k("Profit from investor funds", money(R.incInv - R.P.share), `${nf.format(R.incInv)} earned less ${nf.format(R.P.share)} investor share`, "inv", "var(--gold)")}
      ${k("Other income less expenses", money(R.P.oinc - R.P.opex), `other income ${nf.format(R.P.oinc)} · expenses ${nf.format(R.P.opex)}`, "cash", "var(--c3)")}
      ${k("Net profit", money(R.P.net), "sum of the three", "profit", "var(--pos)")}
    </div></section>
  <div class="grid4">
    <section class="sheet"><div class="sheet-h"><div><h2>Investment allocation</h2><p>Share of capital deployed in each venture at ${fmtDate(S.end)}</p></div></div>
      <div class="sheet-b">${donut(inv.map(x=>({l:x.b.name, v:x.net, c:vcol(x.b.id), extra:[["Own", fmtV(x.own)], ["Investor", fmtV(x.icap)]]})), {center:"Deployed", fmt:kfmt, aria:"Investment allocation by venture", empty:"Allocation appears once capital is invested in a venture."})}</div></section>
    <section class="sheet"><div class="sheet-h"><div><h2>Share of profit by venture</h2><p>Each venture's share of profit income, ${fmtDate(S.start)} to ${fmtDate(S.end)}</p></div></div>
      <div class="sheet-b">${donut(inv.map(x=>({l:x.b.name, v:x.acc, c:vcol(x.b.id), extra:[["Investor share", fmtV(x.share)], ["Kept by Future Axis", fmtV(x.contrib)]]})), {center:"Profit income", fmt:kfmt, aria:"Share of profit income by venture", empty:"Shares appear once profit is accrued in this period."})}</div></section>
    <section class="sheet"><div class="sheet-h"><div><h2>Profit % by venture</h2><p>Annualised return on average capital, against the expected rate</p></div></div>
      <div class="sheet-b">${hbars(inv.filter(x=>x.net>0).sort((p,q)=>q.yld-p.yld).map(x=>({l:x.b.name, v:x.yld, mark:num(x.b.rate), c:vcol(x.b.id), lab:`${(x.yld*100).toFixed(1)}%`,
        tipRows:[["Actual p.a.", pc1(x.yld), vcol(x.b.id)], ["Expected p.a.", pc1(num(x.b.rate))], ["Difference", `${x.varr>=0?"+":""}${(x.varr*100).toFixed(1)} pts`], ["Investors' average rate", pc1(x.invRate)], ["Profit in period", fmtV(x.acc)], ["Average capital", fmtV(x.avg)]]})),
        {key:`<div class="keyrow"><span><i class="sw" style="background:var(--muted)"></i>Actual % p.a.</span><span><i class="tick"></i>Expected % p.a.</span></div>`, empty:"Returns appear once capital is invested."})}</div></section>
    <section class="sheet"><div class="sheet-h"><div><h2>Own vs investor capital</h2><p>How each venture is funded at ${fmtDate(S.end)}</p></div></div>
      <div class="sheet-b">${stackbars(inv.filter(x=>x.net>0).map(x=>({l:x.b.name, a:Math.max(0,x.own), b:Math.max(0,x.icap), c:vcol(x.b.id)})))}</div></section>
  </div>
  <section class="sheet"><div class="sheet-h"><div><h2>Monthly net profit, ${y}</h2><p>Year total ${fmtV(mo.reduce((s,m)=>s+m.net,0))} · by source</p></div><button class="btn sm" data-go="monthly">Monthly detail</button></div><div class="sheet-b" style="overflow-x:auto">${bars(mo)}</div></section>
  <section class="sheet"><div class="sheet-h"><div><h2>Profitability ratios</h2><p>Capital ratios use average capital from ${fmtDate(S.start)} to the last profit posted (${fmtDate(R.aEnd)}). Annualised = ratio × 365 ÷ ${R.ad} days.</p></div></div>
    <div class="tbl"><table><thead><tr><th>Ratio</th><th class="n">Period</th><th class="n">Annualised</th><th>How it is measured</th></tr></thead><tbody>
    ${rr("Net profit ratio",R.npr,null,"Net profit ÷ profit income from ventures")}
    ${rr("Net profit ratio on own investment",R.nprOwn,R.nprOwn*R.an,"(Income earned on own capital − operating expenses) ÷ average own investment")}
    ${rr("Net profit ratio on investor amount",R.nprInv,R.nprInv*R.an,"(Income earned on investor capital − investor profit share) ÷ average investor capital")}
    ${rr("Return credited to investors",R.invRet,R.invRet*R.an,"Investor profit share accrued ÷ average investor capital")}
    ${rr("Return on capital deployed",R.roc,R.roc*R.an,"Net profit ÷ average capital deployed")}
    </tbody></table></div>
    <div class="sheet-b note" style="border-top:1px solid var(--line)">Each venture's income is split between own and investor capital by the capital each had in the venture when it was earned (day by day for automatic accruals): ${nf.format(R.incOwn)} on own capital, ${nf.format(R.incInv)} on investor capital. Operating expenses are borne by Future Axis's own capital.</div>
  </section>
  <section class="sheet"><div class="sheet-h"><div><h2>Venture allocations</h2><p><span class="pill">Own</span> <span class="pill inv">Investor</span> split of each venture's capital</p></div></div>
    <div class="tbl"><table><thead><tr><th>Venture</th><th class="n">Deployed</th><th class="n">Own</th><th class="n">Investor</th><th>Split</th><th class="n">Share</th><th class="n">Expected p.a.</th><th class="n">Actual p.a.</th><th class="n">Net contribution</th></tr></thead>
    <tbody>${alloc || `<tr><td colspan="9" class="empty">No capital invested yet.</td></tr>`}</tbody>
    <tfoot><tr><td>Total</td><td class="n">${money(R.T)}</td><td class="n">${money(R.O)}</td><td class="n">${money(R.K)}</td><td></td><td class="n">${pct(R.T?1:0)}</td><td></td><td class="n">${pct(div(R.P.inc,R.Tavg)*R.an)}</td><td class="n">${money(R.P.spread)}</td></tr></tfoot></table></div></section>
  </div>`;
}

  csvReg("venture-accounts",["ID","Venture","Invested","Withdrawn","Net investment","Investor capital","Own investment","Profit accrued (period)","Profit received (period)","Receivable","Investor share (period)","Investor payable","Net contribution","Actual yield p.a.","Expected p.a."], va.map(x=>[x.b.code,x.b.name,r0(x.added),r0(x.wd),r0(x.net),r0(x.icap),r0(x.own),r0(x.acc),r0(x.recd),r0(x.rec),r0(x.share),r0(x.pay),r0(x.contrib),p2(x.yld),p2(num(x.b.rate))]));

   <div class="tbl"><table><thead><tr><th>ID</th><th>Venture</th><th>Contact person</th><th>Address</th><th class="n">Expected p.a.</th><th>Mode</th><th class="n">Start</th><th>Status</th></tr></thead><tbody>${rows || `<tr><td colspan="8"><div class="empty"><b>No ventures yet</b>Add a venture to start allocating capital.</div></td></tr>`}</tbody></table></div></section>

function viewLedger(){
  const lf = S.lf;
  let rows = S.led.filter(t => (!lf.biz || (lf.biz==="HQ" ? !t.bizId : t.bizId===lf.biz)) && (!lf.type || t.type===lf.type) && (!lf.q || `${t.ref||""} ${plLabel(t.placementId)}`.toLowerCase().includes(lf.q.toLowerCase())));
  rows.sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.createdAt||"").localeCompare(b.createdAt||""));
  const single = lf.biz && lf.biz!=="HQ";
  let ri=0, rr=0, rp=0;
  const lines = rows.map(t=>{ const a=num(t.amount); ri+=a*eff(t,"inv"); rr+=a*eff(t,"rec"); rp+=a*eff(t,"pay");
    const cls = INV_TYPES.includes(t.type)?"inv":VEN_TYPES.includes(t.type)?"ok":"";
    return {t, html:`<tr class="click" data-edit="led:${t.id}"><td class="n" style="text-align:left">${fmtDate(t.date)}</td><td>${h(bizCode(t.bizId))}<div class="note">${h(bizName(t.bizId))}</div></td><td><span class="pill ${cls}">${h(t.type)}</span>${t.auto?' <span class="pill">Auto</span>':""}${t.example?' <span class="pill warn">Example</span>':""}${rcptBadge("ledger", t)}</td><td>${h(plLabel(t.placementId) || shName(t.shareholderId) || supName(t.supplierId))}${t.category?`<div class="note">${h(t.category)}</div>`:""}</td><td class="note">${h(t.ref||"")}</td><td class="note">${isCashType(t.type)?h([t.method, bankCode(t.bankId)].filter(Boolean).join(" · ")||"–")+(MATCHED().has("led:"+t.id)?' <span class="pill ok">Reconciled</span>':""):""}</td><td class="n">${money(a)}</td>${single?`<td class="n">${money(ri)}</td><td class="n">${money(rr)}</td><td class="n">${money(rp)}</td>`:""}</tr>`, ri, rr, rp}; });
  csvReg("ledger",["Date","Venture ID","Venture","Type","Placement","Reference","Payment method","Bank account","Amount"], rows.map(t=>[t.date,bizCode(t.bizId),bizName(t.bizId),t.type,plLabel(t.placementId),t.ref,t.method,bankCode(t.bankId),num(t.amount)]));
  const body = lines.reverse().map(l=>l.html).join("");
  const opt = (v,l,sel)=>`<option value="${h(v)}" ${sel===v?"selected":""}>${h(l)}</option>`;
  return `<div class="head"><div><span class="eyebrow">Receivable &amp; payable ledger</span><h1>Ledger</h1><p>Every movement with a venture or investor: investments in and out, profit accrued and received, investor profit accrued and paid. Newest first.</p></div>${S.canWrite!==false?`<div class="row"><button class="btn" data-acc="1">Run profit accruals</button><button class="btn primary" data-new="led">Add entry</button></div>`:""}</div>
  <section class="sheet"><div class="sheet-h"><div class="filters" style="flex:1 1 520px">
    <select id="lfBiz" aria-label="Venture filter">${opt("","All ventures",lf.biz)}${opt("HQ","Future Axis (HQ)",lf.biz)}${S.biz.map(b=>opt(b.id,`${b.code} · ${b.name}`,lf.biz)).join("")}</select>
    <select id="lfType" aria-label="Type filter">${opt("","All transaction types",lf.type)}${Object.keys(TYPES).map(t=>opt(t,t,lf.type)).join("")}</select>
    <input id="lfQ" placeholder="Search reference or investor" value="${h(lf.q)}" aria-label="Search">
  </div>${csvBtn("ledger")}</div>
  ${single?`<div class="sheet-b note" style="border-bottom:1px solid var(--line)">Venture statement for <b>${h(bizName(lf.biz))}</b>: running balances of investment, profit receivable and investor profit payable.</div>`:""}
  <div class="tbl"><table><thead><tr><th>Date</th><th>Venture</th><th>Type</th><th>Placement / shareholder / supplier</th><th>Reference</th><th>Paid via</th><th class="n">Amount</th>${single?'<th class="n">Investment bal.</th><th class="n">Receivable bal.</th><th class="n">Payable bal.</th>':""}</tr></thead>
  <tbody>${body || `<tr><td colspan="9"><div class="empty"><b>No entries${lf.biz||lf.type||lf.q?" match these filters":" yet"}</b>${lf.biz||lf.type||lf.q?"Clear a filter to see more.":"Post the first investment or owner capital contribution."}</div></td></tr>`}</tbody></table></div>
  <div class="sheet-b note" style="border-top:1px solid var(--line)">${rows.length} entr${rows.length===1?"y":"ies"} shown of ${S.led.length}. Investor placements are taken from the Investors register, so they are not posted here.</div></section>`;
}

function viewReturns(){
  const ir = investorReturns();
  csvReg("investor-returns",["Placement","Investor","Venture","Amount","Agreed rate","Placement date","Days","Expected to date","Accrued","Paid","Payable","Capital repaid","Capital outstanding","Accrual gap","Actual p.a."], ir.map(x=>[x.p.code,x.p.investor,bizName(x.p.bizId),r0(num(x.p.amount)),p2(num(x.p.rate)),x.p.date,x.d,r0(x.expected),r0(x.accrued),r0(x.paid),r0(x.payable),r0(x.repaid),r0(x.out),r0(x.varr),p2(x.ann)]));
  const byInv = {};
  ir.forEach(x=>{ const k=(x.p.investor||"").trim(); const o = byInv[k] ||= {name:k, n:0, amt:0, out:0, acc:0, paid:0, pay:0, per:0, ventures:new Set()}; o.n++; o.amt+=x.p.date<=S.end?num(x.p.amount):0; o.out+=x.out; o.acc+=x.accrued; o.paid+=x.paid; o.pay+=x.payable; o.per+=x.periodAcc; o.ventures.add(bizName(x.p.bizId)); });
  const inv = Object.values(byInv).sort((a,b)=>b.out-a.out);
  csvReg("investor-summary",["Investor","Placements","Ventures","Capital outstanding","Profit accrued (period)","Accrued to date","Paid to date","Payable"], inv.map(o=>[o.name,o.n,[...o.ventures].join("; "),r0(o.out),r0(o.per),r0(o.acc),r0(o.paid),r0(o.pay)]));
  const T = k => ir.reduce((s,x)=>s+x[k],0);
  const gap = x => Math.abs(x.varr) < 1 ? '<span class="pill ok">On track</span>' : x.varr>0 ? `<span class="pill warn" title="Accrue ${nf.format(x.varr)} more to match the agreed rate">Under ${nf.format(x.varr)}</span>` : `<span class="pill bad">Over ${nf.format(-x.varr)}</span>`;
  return `<div class="head"><div><span class="eyebrow">Report</span><h1>Investor returns</h1><p>Profit owed to each investor at the agreed rate, compared with what has been accrued and paid. Position at ${fmtDate(S.end)}, cumulative from each placement date.</p></div>${S.canWrite!==false?'<button class="btn primary" data-acc="1">Run profit accruals</button>':""}</div>
  <div class="stack">
  <section class="sheet"><div class="sheet-h"><div><h2>By investor</h2><p>${inv.length} investors</p></div>${csvBtn("investor-summary")}</div>
   <div class="tbl"><table><thead><tr><th>Investor</th><th>Ventures</th><th class="n">Capital outstanding</th><th class="n">Profit this period</th><th class="n">Accrued to date</th><th class="n">Paid to date</th><th class="n">Payable</th><th class="n">Return p.a. (period)</th></tr></thead>
   <tbody>${inv.map(o=>`<tr><td><b style="font-weight:600">${h(o.name)}</b><div class="note">${o.n} placement${o.n===1?"":"s"}</div></td><td class="note">${h([...o.ventures].join(", "))}</td><td class="n">${money(o.out)}</td><td class="n">${money(o.per)}</td><td class="n">${money(o.acc)}</td><td class="n">${money(o.paid)}</td><td class="n">${money(o.pay)}</td><td class="n">${pct(div(o.per,o.out)*365/(days(S.start,S.end)+1))}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">No placements yet.</td></tr>`}</tbody></table></div></section>
  <section class="sheet"><div class="sheet-h"><div><h2>By placement</h2><p>Expected = amount × agreed rate × days invested ÷ 365</p></div>${csvBtn("investor-returns")}</div>

function viewMonthly(){

  const y = S.year && yrs.includes(S.year) ? S.year : +S.end.slice(0,4);
  const mo = monthly(y);
  const sum = k => mo.reduce((s,m)=>s+m[k],0);
  csvReg("monthly-profit",["Month","Profit income","Investor share","Operating expenses","Net profit","Net margin","Profit received","Cumulative net profit"], mo.map(m=>[m.to.slice(0,7),r0(m.inc),r0(m.share),r0(m.opex),r0(m.net),p2(div(m.net,m.inc)),r0(m.recd),r0(m.cum)]));
  const mat = S.biz.map(b=>({b, v:mo.map(m=>tsum("Profit Accrued",m.from,m.to,t=>t.bizId===b.id))}));
  csvReg("venture-income",["Venture",...mo.map(m=>m.to.slice(0,7)),"Total"], mat.map(r=>[r.b.name,...r.v.map(r0),r0(r.v.reduce((a,b)=>a+b,0))]));

function viewStatementsPeriod(){
  const {start,end} = S, open = addDays(start,-1);
  const P = pnl(start,end), I = pnl(ORIGIN,end), B = balanceSheet(end), O = balanceSheet(open);
  const sP = incomeSplit(start,end), sI = incomeSplit(ORIGIN,end);
  const cf = {
    recd: tsum("Profit Received",start,end), oinc: tsum("Other Income",start,end), ipaid: -tsum("Investor Profit Paid",start,end), opex: -tsum("Operating Expense",start,end),
    add: -tsum("Investment Addition",start,end), wd: tsum("Investment Withdrawal",start,end),
    own: tsum("Owner Capital Contribution",start,end), draw: -tsum("Owner Drawing",start,end), plc: placed(start,end), rep: -tsum("Investor Capital Repaid",start,end)
  };
  cf.op = cf.recd+cf.oinc+cf.ipaid+cf.opex; cf.iv = cf.add+cf.wd; cf.fi = cf.own+cf.draw+cf.plc+cf.rep; cf.net = cf.op+cf.iv+cf.fi;
  const cfChk = cf.net + O.cash - B.cash;
  const L = (l,a,b,cls="ind")=>`<tr class="${cls}"><td>${l}</td><td class="n">${money(a)}</td><td class="n">${b===undefined?"":money(b)}</td></tr>`;
  const sub = l=>`<tr class="sub"><td colspan="3">${l}</td></tr>`;
  const ok = v => Math.abs(v)<0.5 ? '<span class="pill ok">Balanced</span>' : `<span class="pill bad">Difference ${nf.format(v)}</span>`;
  const cur = h(VIEW());
  csvReg("financial-statements",["Statement","Line","Col 1","Col 2"],[
    ["Income statement","Owner income (profit on own capital)",r0(sP.own),r0(sI.own)],["Income statement","Profit on investor capital",r0(sP.inv),r0(sI.inv)],["Income statement","Less: profit share to investors",r0(-P.share),r0(-I.share)],["Income statement","Income from investor placements",r0(sP.inv-P.share),r0(sI.inv-I.share)],["Income statement","Other income",r0(P.oinc),r0(I.oinc)],["Income statement","Operating expenses",r0(-P.opex),r0(-I.opex)],["Income statement","Net profit",r0(P.net),r0(I.net)],
    ["Balance sheet","Cash",r0(B.cash),r0(O.cash)],["Balance sheet","Investment in ventures",r0(B.inv),r0(O.inv)],["Balance sheet","Profit receivable",r0(B.rec),r0(O.rec)],["Balance sheet","Total assets",r0(B.assets),r0(O.assets)],["Balance sheet","Investor capital",r0(B.icap),r0(O.icap)],["Balance sheet","Investor profit payable",r0(B.pay),r0(O.pay)],["Balance sheet","Share capital (owner investment)",r0(B.owner),r0(O.owner)],["Balance sheet","Retained earnings",r0(B.re),r0(O.re)],["Balance sheet","Total liabilities and equity",r0(B.le),r0(O.le)],
    ["Cash flow","Net cash from operating",r0(cf.op),""],["Cash flow","Net cash from investing",r0(cf.iv),""],["Cash flow","Net cash from financing",r0(cf.fi),""],["Cash flow","Net change in cash",r0(cf.net),""],["Cash flow","Opening cash",r0(O.cash),""],["Cash flow","Closing cash",r0(B.cash),""]]);
  return `<div class="head"><div><span class="eyebrow">${h(S.cfg.entity)} · ${cur}</span><h1>Financial statements</h1><p>For the period ${fmtDate(start)} to ${fmtDate(end)}. Built directly from the ledger and investor register.</p></div>${csvBtn("financial-statements")}</div>
  <div class="stack">
  <section class="sheet fs"><div class="sheet-h"><h2>Statement of profit or loss</h2></div><div class="tbl"><table>
    <thead><tr><th></th><th class="n">This period</th><th class="n">Inception to ${fmtDate(end)}</th></tr></thead><tbody>
    ${sub("Owner income")}${L("Profit on own capital invested in ventures",sP.own,sI.own)}${L("Total owner income",sP.own,sI.own,"tot")}
    ${sub("Income from investor placements")}${L("Profit on investor capital invested in ventures",sP.inv,sI.inv)}${L("Less: profit share to investors",-P.share,-I.share)}${L("Net income from investor placements",sP.inv-P.share,sI.inv-I.share,"tot")}
    ${sub("Other")}${L("Other income",P.oinc,I.oinc)}${L("Less: operating expenses",-P.opex,-I.opex)}
    ${(()=>{ const cat = (f,t) => { const o = {}; for (const x of S.led) if (x.type==="Operating Expense" && x.date>=f && x.date<=t){ const c = x.category||"Uncategorised"; o[c] = (o[c]||0) + num(x.amount); } return o; };
      const a = cat(start,end), b = cat(ORIGIN,end); return Object.keys(b).sort().map(c => `<tr class="ind"><td class="note" style="padding-left:44px">${h(c)}</td><td class="n note">${money(-(a[c]||0))}</td><td class="n note">${money(-b[c])}</td></tr>`).join(""); })()}
    ${L("Net profit",P.net,I.net,"gt")}
    <tr class="ind"><td class="note">Owner income as % of net profit</td><td class="n">${pct(div(sP.own,P.net))}</td><td class="n">${pct(div(sI.own,I.net))}</td></tr>
    <tr class="ind"><td class="note">Net profit ratio</td><td class="n">${pct(div(P.net,P.inc))}</td><td class="n">${pct(div(I.net,I.inc))}</td></tr></tbody></table></div></section>
  <section class="sheet fs"><div class="sheet-h"><h2>Statement of financial position</h2><span class="chk">${ok(B.diff)}</span></div><div class="tbl"><table>
    <thead><tr><th></th><th class="n">${fmtDate(end)}</th><th class="n">${fmtDate(open)}</th></tr></thead><tbody>
    ${sub("Assets")}${L("Cash and bank",B.cash,O.cash)}${L("Investment in ventures",B.inv,O.inv)}${L("Profit receivable from ventures",B.rec,O.rec)}${L("Total assets",B.assets,O.assets,"tot")}
    ${sub("Liabilities")}${L("Investor capital (placements outstanding)",B.icap,O.icap)}${L("Investor profit payable",B.pay,O.pay)}${L("Total liabilities",B.liab,O.liab,"tot")}
    ${sub("Equity")}${L("Share capital (owner investment)",B.owner,O.owner)}${L("Retained earnings",B.re,O.re)}${L("Total equity",B.eq,O.eq,"tot")}
    ${L("Total liabilities and equity",B.le,O.le,"gt")}</tbody></table></div></section>
  <section class="sheet fs"><div class="sheet-h"><h2>Statement of cash flows</h2><span class="chk">${ok(cfChk)}</span></div><div class="tbl"><table>
    <thead><tr><th></th><th class="n">This period</th><th></th></tr></thead><tbody>
    ${sub("Operating activities")}${L("Profit received from ventures",cf.recd)}${L("Other income received",cf.oinc)}${L("Profit paid to investors",cf.ipaid)}${L("Operating expenses paid",cf.opex)}${L("Net cash from operating activities",cf.op,undefined,"tot")}
    ${sub("Investing activities")}${L("Investments made in ventures",cf.add)}${L("Investments withdrawn from ventures",cf.wd)}${L("Net cash from investing activities",cf.iv,undefined,"tot")}
    ${sub("Financing activities")}${L("Share capital contributed",cf.own)}${L("Owner drawings",cf.draw)}${L("Investor placements received",cf.plc)}${L("Investor capital repaid",cf.rep)}${L("Net cash from financing activities",cf.fi,undefined,"tot")}
    ${L("Net change in cash",cf.net,undefined,"tot")}${L("Opening cash",O.cash)}${L("Closing cash",B.cash,undefined,"gt")}</tbody></table></div></section>
  <p class="note">Investor capital is shown as a liability because placements are repayable under the profit participation terms. Reclassify to equity if your final structure issues shares to investors.</p>
  </div>`;
}

let FORM_KIND = "";
function fieldHtml(f, v){
  const [k,l0,type,req,cls,opts] = f, id="ff_"+k, r = req?"required":"";
  const l = l0 + ((type==="money" && (FORM_KIND==="led" || FORM_KIND==="pl")) ? ` (${VIEW()})` : "");
  let c;
  if (type==="textarea") c = `<textarea id="${id}" ${r}>${h(v)}</textarea>`;
  else if (type==="select") c = `<select id="${id}">${opts.map(o=>`<option value="${h(o)}" ${o===v?"selected":""}>${o===""?"Not set":h(o)}</option>`).join("")}</select>`;
  else if (type==="sh") c = `<select id="${id}"><option value="">${S.sh.length?"Not assigned":"No shareholders yet (add them in Share capital)"}</option>${S.sh.map(a=>`<option value="${a.id}" ${a.id===v?"selected":""}>${h(a.code)} · ${h(a.name)}</option>`).join("")}</select>`;
  else if (type==="bank") c = `<select id="${id}"><option value="">${S.bank.length?"None":"No bank accounts yet (add one in the Bank tab)"}</option>${S.bank.filter(a=>!inactive(a)||a.id===v).map(a=>`<option value="${a.id}" ${a.id===v?"selected":""}>${h(a.code)} · ${h(a.name)}</option>`).join("")}</select>`;
  else if (type==="inv") c = `<select id="${id}" ${r}><option value="">${S.inv.length?"Choose an investor":"No investors yet: add them in Master data first"}</option>${S.inv.filter(i=>!inactive(i)||i.id===v).map(i=>`<option value="${i.id}" ${i.id===v?"selected":""}>${h(i.code)} · ${h(i.name)}</option>`).join("")}</select>`;

/* ---------- parsing helpers (bank files + import template) ---------- */
const normH = v => String(v ?? "").toLowerCase().replace(/\*/g,"").replace(/\(.*?\)/g,"").replace(/[^a-z0-9%]+/g," ").trim();
function validYMD(y,m,d){ const t = new Date(y, m-1, d); return t.getFullYear()===y && t.getMonth()===m-1 && t.getDate()===d ? `${y}-${pad(m)}-${pad(d)}` : ""; }
const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function parseDateAny(v, fmt="dmy"){
  if (v === "" || v == null) return "";
  if (v instanceof Date && !isNaN(v)) return iso(v);
  if (typeof v === "number"){ if (v > 20000 && v < 80000 && window.XLSX){ const d = XLSX.SSF.parse_date_code(v); return d ? validYMD(d.y, d.m, d.d) : ""; } return ""; }
  const s = String(v).trim().replace(/\s+/g," ");
  let m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s); if (m) return validYMD(+m[1], +m[2], +m[3]);
  m = /^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2,4})\b/.exec(s);
  if (m){ let a=+m[1], b=+m[2], y=+m[3]; if (y<100) y+=2000; let d=a, mo=b; if (fmt==="mdy" || (a<=12 && b>12)) { d=b; mo=a; } return validYMD(y, mo, d); }
  m = /^(\d{1,2})[-\/ ]([A-Za-z]{3,9})[-\/ ,]*(\d{2,4})/.exec(s);
  if (m){ const mo = MONTHS[m[2].slice(0,4).toLowerCase()] || MONTHS[m[2].slice(0,3).toLowerCase()]; let y=+m[3]; if (y<100) y+=2000; return mo ? validYMD(y, mo, +m[1]) : ""; }
  m = /^([A-Za-z]{3,9}) (\d{1,2}),? (\d{4})/.exec(s);
  if (m){ const mo = MONTHS[m[1].slice(0,3).toLowerCase()]; return mo ? validYMD(+m[3], mo, +m[2]) : ""; }
  return "";
}
function parseAmt(v){
  if (v === "" || v == null) return NaN;
  if (typeof v === "number") return v;
  let s = String(v).trim(); if (!s) return NaN;
  let sign = 1;
  if (/^\(.*\)$/.test(s)) { sign = -1; }
  if (/\bdr\b|debit/i.test(s)) sign = -1;
  if (/^-/.test(s) || /-$/.test(s)) sign = -1;
  s = s.replace(/[^0-9.]/g, "");
  const n = parseFloat(s); return isFinite(n) ? sign*n : NaN;
}
function parseRate(v){
  if (v === "" || v == null) return NaN;
  if (typeof v === "string" && v.trim().endsWith("%")) return parseAmt(v)/100;
  const n = parseAmt(v); if (!isFinite(n)) return NaN;
  return Math.abs(n) > 1 ? n/100 : n;
}
function pickOpt(v, list){ const s = String(v ?? "").trim().toLowerCase(); if (!s) return ""; return list.find(o => o.toLowerCase()===s) || list.find(o => o.toLowerCase().startsWith(s)) || null; }

/* ---------- bank: book items, matching, reconciliation ---------- */
function bookItems(){
  const out = [];
  for (const t of S.led){ const c = (TYPES[t.type]||{}).cash; if (!c || t.method==="Profit adjustment") continue;
    out.push({key:"led:"+t.id, kind:"led", id:t.id, bankId:t.bankId||"", date:t.date, amt:c*num(t.amount), fx: t.fxCur ? {cur:t.fxCur, amt:c*num(t.fxAmount)} : null, label:`${t.type}${t.bizId?" · "+bizCode(t.bizId):""}${t.placementId?" · "+plLabel(t.placementId):""}`, ref:t.ref||""}); }
  for (const p of S.pl){ if (!p.date || p.method==="Profit adjustment") continue;
    out.push({key:"pl:"+p.id, kind:"pl", id:p.id, bankId:p.bankId||"", date:p.date, amt:num(p.amount), fx: p.payCur && p.payAmt && p.payCur!=="Other" ? {cur:p.payCur, amt:num(p.payAmt)} : null, label:`Investor placement ${p.code||""} · ${p.investor||""}`, ref:p.notes||""}); }
  return out;
}
function MATCHED(){
  if (MATCHED.cache) return MATCHED.cache;
  const items = new Map(bookItems().map(i=>[i.key,i]));
  const set = new Set(); for (const l of S.bl) if (l.matchKey && items.has(l.matchKey)) set.add(l.matchKey);
  MATCHED.cache = set; MATCHED.items = items; return set;
}
const lineAmt = l => num(l.cr) - num(l.dr);
const near = (a,b) => Math.abs(a-b) < 0.005;
const nearA = (a,b) => Math.abs(a-b) < 0.025;
const acctCur = id => (S.bank.find(a=>a.id===id)?.currency || "AED").toUpperCase();
const itemIn = (it, cur) => it.fx && String(it.fx.cur).toUpperCase()===cur ? it.fx.amt : conv(it.amt, VIEW(), cur);
function recon(acct, D){
  MATCHED(); const items = MATCHED.items, cur = (acct.currency||"AED").toUpperCase();
  const A = it => itemIn(it, cur);
  const openD = acct.openDate || "";
  const lines = S.bl.filter(l => l.accountId===acct.id && l.date<=D && (!openD || l.date>openD));
  const allBook = [...items.values()].filter(i => i.bankId===acct.id && i.date<=D);
  const book = allBook.filter(i => !openD || i.date>openD);
  const stmtBal = num(acct.openBal) + lines.reduce((s,l)=>s+lineAmt(l),0);
  const bookBal = allBook.reduce((s,i)=>s+A(i),0);
  const okLine = l => { const it = l.matchKey && items.get(l.matchKey); return it && it.date<=D && nearA(A(it), lineAmt(l)); };
  const matchedKeys = new Set(lines.filter(okLine).map(l=>l.matchKey));
  const ulines = lines.filter(l => !okLine(l));
  const ubook = book.filter(i => !matchedKeys.has(i.key)).map(i => ({...i, amtA: A(i)}));
  const bankIn = ulines.filter(l=>lineAmt(l)>0).reduce((s,l)=>s+lineAmt(l),0);
  const bankOut = -ulines.filter(l=>lineAmt(l)<0).reduce((s,l)=>s+lineAmt(l),0);
  const bookIn = ubook.filter(i=>i.amtA>0).reduce((s,i)=>s+i.amtA,0);
  const bookOut = -ubook.filter(i=>i.amtA<0).reduce((s,i)=>s+i.amtA,0);
  const adjusted = stmtBal - bankIn + bankOut + bookIn - bookOut;
  const bookAtOpen = openD ? allBook.filter(i=>i.date<=openD).reduce((s,i)=>s+A(i),0) : 0;
  const withBal = S.bl.filter(l => l.accountId===acct.id && l.date<=D && l.balance!=null && l.balance!=="").sort((a,b)=>a.date.localeCompare(b.date) || num(a.seq)-num(b.seq));
  const fileBal = withBal.length ? num(withBal[withBal.length-1].balance) : null;
  return {lines, ulines, ubook, stmtBal, bookBal, bankIn, bankOut, bookIn, bookOut, adjusted, diff: adjusted - bookBal, bookAtOpen, fileBal, cur};
}
function candidatesFor(line){
  MATCHED(); const used = MATCHED.cache, a = lineAmt(line), cur = acctCur(line.accountId);
  return [...MATCHED.items.values()]
    .filter(i => !used.has(i.key) && nearA(itemIn(i, cur), a) && (i.bankId===line.accountId || !i.bankId))
    .sort((p,q) => Math.abs(days(p.date, line.date)) - Math.abs(days(q.date, line.date)));
}
async function linkLine(line, item){

    const col = item.kind==="led" ? "ledger" : "placements", list = item.kind==="led" ? S.led : S.pl;
    const rec = list.find(x=>x.id===item.id);
    if (rec && !rec.bankId){ const {id:rid, ...rd} = rec; await S.db.collection(col).doc(item.id).set({...rd, bankId: line.accountId, method: rd.method || "Bank transfer"}); }
  }
  await S.db.collection("bankLines").doc(id).set({...data, matchKey: item.key});
}
async function autoMatch(acctId){
  MATCHED(); const used = new Set(MATCHED.cache), items = [...MATCHED.items.values()];
  const lines = S.bl.filter(l => l.accountId===acctId && !(l.matchKey && MATCHED.items.has(l.matchKey))).sort((a,b)=>a.date.localeCompare(b.date));
  const upd = [], assign = [];
  for (const l of lines){
    const a = lineAmt(l);
    const c = items.filter(i => !used.has(i.key) && nearA(itemIn(i, acctCur(acctId)), a) && (i.bankId===acctId || !i.bankId) && Math.abs(days(i.date, l.date))<=10)
      .sort((p,q) => (p.bankId===acctId?0:1)-(q.bankId===acctId?0:1) || Math.abs(days(p.date,l.date)) - Math.abs(days(q.date,l.date)))[0];
    if (!c) continue;
    used.add(c.key); const {id, ...d} = l; upd.push({id, data:{...d, matchKey:c.key}});
    if (!c.bankId) assign.push(c);
  }
  for (const c of assign){
    const col = c.kind==="led" ? "ledger" : "placements", rec = (c.kind==="led"?S.led:S.pl).find(x=>x.id===c.id);
    if (rec){ const {id, ...rd} = rec; await S.db.collection(col).doc(id).set({...rd, bankId:acctId, method: rd.method || "Bank transfer"}); }
  }
  if (upd.length) await S.db.bulk("bankLines", upd);
  return upd.length;
}
function lineHash(acctId, date, desc, dr, cr, bal){ return `${acctId}|${date}|${String(desc||"").trim().toLowerCase()}|${num(dr).toFixed(2)}|${num(cr).toFixed(2)}|${bal==null||bal===""?"":num(bal).toFixed(2)}`; }
function withOccurrence(rows){ const seen = {}; return rows.map(r => { const n = (seen[r.hash] = (seen[r.hash]||0)+1); return {...r, hash: r.hash+"#"+n}; }); }
