/* ---------- bank: book items, matching, reconciliation ---------- */
function bookItems(){
  const out = [];
  for (const t of S.led){ const c = (TYPES[t.type]||{}).cash; if (!c || NONCASH(t.method)) continue;
    out.push({key:"led:"+t.id, kind:"led", id:t.id, bankId:t.bankId||"", date:t.date, amt:c*num(t.amount), fx: t.fxCur ? {cur:t.fxCur, amt:c*num(t.fxAmount)} : null, label:`${t.type}${t.bizId?" · "+bizCode(t.bizId):""}${t.placementId?" · "+plLabel(t.placementId):""}`, ref:t.ref||""}); }
  for (const p of S.pl){ if (!p.date || NONCASH(p.method)) continue;
    out.push({key:"pl:"+p.id, kind:"pl", id:p.id, bankId:p.bankId||"", date:p.date, amt:num(p.amount), fx: p.payCur && p.payAmt && p.payCur!=="Other" ? {cur:p.payCur, amt:num(p.payAmt)} : null, label:`Investor placement ${p.code||""} · ${p.investor||""}`, ref:p.notes||""}); }
  return out;
}
function MATCHED(){
  if (MATCHED.cache) return MATCHED.cache;
  const items = new Map(bookItems().map(i=>[i.key,i]));
  const set = new Set(); for (const l of S.bl) if (l.matchKey && items.has(l.matchKey)) set.add(l.matchKey);
  MATCHED.cache = set; MATCHED.items = items; return set;
}
const lineAmt = l => num(l.cr) - num(l.dr);
const near = (a,b) => Math.abs(a-b) < 0.005;
const nearA = (a,b) => Math.abs(a-b) < 0.025;
const acctCur = id => (S.bank.find(a=>a.id===id)?.currency || "AED").toUpperCase();
const itemIn = (it, cur) => it.fx && String(it.fx.cur).toUpperCase()===cur ? it.fx.amt : conv(it.amt, VIEW(), cur);
function recon(acct, D){
  MATCHED(); const items = MATCHED.items, cur = (acct.currency||"AED").toUpperCase();
  const A = it => itemIn(it, cur);
  const openD = acct.openDate || "";
  const lines = S.bl.filter(l => l.accountId===acct.id && l.date<=D && (!openD || l.date>openD));
  const allBook = [...items.values()].filter(i => i.bankId===acct.id && i.date<=D);
  const book = allBook.filter(i => !openD || i.date>openD);
  const stmtBal = num(acct.openBal) + lines.reduce((s,l)=>s+lineAmt(l),0);
  const bookBal = allBook.reduce((s,i)=>s+A(i),0);
  const okLine = l => { const it = l.matchKey && items.get(l.matchKey); return it && it.date<=D && nearA(A(it), lineAmt(l)); };
  const matchedKeys = new Set(lines.filter(okLine).map(l=>l.matchKey));
  const ulines = lines.filter(l => !okLine(l));
  const ubook = book.filter(i => !matchedKeys.has(i.key)).map(i => ({...i, amtA: A(i)}));
  const bankIn = ulines.filter(l=>lineAmt(l)>0).reduce((s,l)=>s+lineAmt(l),0);
  const bankOut = -ulines.filter(l=>lineAmt(l)<0).reduce((s,l)=>s+lineAmt(l),0);
  const bookIn = ubook.filter(i=>i.amtA>0).reduce((s,i)=>s+i.amtA,0);
  const bookOut = -ubook.filter(i=>i.amtA<0).reduce((s,i)=>s+i.amtA,0);
  const adjusted = stmtBal - bankIn + bankOut + bookIn - bookOut;
  const bookAtOpen = openD ? allBook.filter(i=>i.date<=openD).reduce((s,i)=>s+A(i),0) : 0;
  const withBal = S.bl.filter(l => l.accountId===acct.id && l.date<=D && l.balance!=null && l.balance!=="").sort((a,b)=>a.date.localeCompare(b.date) || num(a.seq)-num(b.seq));
  const fileBal = withBal.length ? num(withBal[withBal.length-1].balance) : null;
  return {lines, ulines, ubook, stmtBal, bookBal, bankIn, bankOut, bookIn, bookOut, adjusted, diff: adjusted - bookBal, bookAtOpen, fileBal, cur};
}
function candidatesFor(line){
  MATCHED(); const used = MATCHED.cache, a = lineAmt(line), cur = acctCur(line.accountId);
  return [...MATCHED.items.values()]
    .filter(i => !used.has(i.key) && nearA(itemIn(i, cur), a) && (i.bankId===line.accountId || !i.bankId))
    .sort((p,q) => Math.abs(days(p.date, line.date)) - Math.abs(days(q.date, line.date)));
}
async function linkLine(line, item){
  const {id, ...data} = line;
  if (item.kind==="led" || item.kind==="pl"){
    const col = item.kind==="led" ? "ledger" : "placements", list = item.kind==="led" ? S.led : S.pl;
    const rec = list.find(x=>x.id===item.id);
    if (rec && !rec.bankId){ const {id:rid, ...rd} = rec; await S.db.collection(col).doc(item.id).set({...rd, bankId: line.accountId, method: rd.method || "Bank transfer"}); }
  }
  await S.db.collection("bankLines").doc(id).set({...data, matchKey: item.key});
}
async function autoMatch(acctId){
  MATCHED(); const used = new Set(MATCHED.cache), items = [...MATCHED.items.values()];
  const lines = S.bl.filter(l => l.accountId===acctId && !(l.matchKey && MATCHED.items.has(l.matchKey))).sort((a,b)=>a.date.localeCompare(b.date));
  const upd = [], assign = [];
  for (const l of lines){
    const a = lineAmt(l);
    const c = items.filter(i => !used.has(i.key) && nearA(itemIn(i, acctCur(acctId)), a) && (i.bankId===acctId || !i.bankId) && Math.abs(days(i.date, l.date))<=10)
      .sort((p,q) => (p.bankId===acctId?0:1)-(q.bankId===acctId?0:1) || Math.abs(days(p.date,l.date)) - Math.abs(days(q.date,l.date)))[0];
    if (!c) continue;
    used.add(c.key); const {id, ...d} = l; upd.push({id, data:{...d, matchKey:c.key}});
    if (!c.bankId) assign.push(c);
  }
  for (const c of assign){
    const col = c.kind==="led" ? "ledger" : "placements", rec = (c.kind==="led"?S.led:S.pl).find(x=>x.id===c.id);
    if (rec){ const {id, ...rd} = rec; await S.db.collection(col).doc(id).set({...rd, bankId:acctId, method: rd.method || "Bank transfer"}); }
  }
  if (upd.length) await S.db.bulk("bankLines", upd);
  return upd.length;
}
function lineHash(acctId, date, desc, dr, cr, bal){ return `${acctId}|${date}|${String(desc||"").trim().toLowerCase()}|${num(dr).toFixed(2)}|${num(cr).toFixed(2)}|${bal==null||bal===""?"":num(bal).toFixed(2)}`; }
function withOccurrence(rows){ const seen = {}; return rows.map(r => { const n = (seen[r.hash] = (seen[r.hash]||0)+1); return {...r, hash: r.hash+"#"+n}; }); }

/* ---------- bank: actions ---------- */
async function bankAction(b){
  const a = b.dataset.bact, l = S.bl.find(x=>x.id===b.dataset.lid);
  try {
    if (a==="upload") return openBankUpload();
    if (a==="record") return openRecord(S.bankSel);
    if (a==="auto"){ b.disabled = true; const n = await autoMatch(S.bankSel); toast(n ? `Matched ${n} line${n===1?"":"s"}` : "No new matches found (same amount within 10 days)"); return; }
    if (a==="unmatch" && l){ const {id, ...d} = l; await S.db.collection("bankLines").doc(id).set({...d, matchKey:""}); toast("Unmatched"); return; }
    if (a==="dline" && l){
      if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "Delete?"; return; }
      await S.db.collection("bankLines").doc(l.id).delete(); toast("Line deleted"); return;
    }
    if (a==="dbatch"){
      const lines = S.bl.filter(x=>x.accountId===S.bankSel && x.batchId && x.batchId!=="manual");

function showUploadMap(acct, hdr, data, g){
  const opts = sel => `<option value="-1">(not in file)</option>` + hdr.map((x,i)=>`<option value="${i}" ${i===sel?"selected":""}>${h(x||"Column "+(i+1))}</option>`).join("");
  const F = [["date","Date *"],["desc","Description *"],["ref","Reference"],["dr","Money out (debit)"],["cr","Money in (credit)"],["amt","Single amount column (+ in / − out)"],["bal","Balance"]];
  $("#uMap").innerHTML = `<div class="stack" style="gap:14px">
    <p class="note" style="margin:0">Check which column is which. Use either <b>Money out + Money in</b>, or a <b>single amount</b> column where money out is negative.</p>
    <div class="form">${F.map(([k,l])=>`<label>${l}<select id="um_${k}">${opts(g[k])}</select></label>`).join("")}
      <label>Date format<select id="um_fmt"><option value="dmy">Day/Month/Year (31/08/2026)</option><option value="mdy">Month/Day/Year (08/31/2026)</option></select></label></div>
    <div id="uPrev"></div>
    <label class="row" style="gap:8px;font-size:13px"><input type="checkbox" id="uAuto" checked> Auto-match to the ledger after upload</label>
    <div class="row"><button class="btn primary" id="uGo" type="button">Import lines</button><span class="note" id="uProg"></span></div></div>`;

    const out = [], bad = [];

      if (!r.some(x=>String(x).trim())) return;
      const date = parseDateAny(r[c.date], fmt), desc = c.desc>=0 ? String(r[c.desc]).trim() : "";
      let dr = 0, cr = 0;
      if (c.amt >= 0){ const v = parseAmt(r[c.amt]); if (isFinite(v)){ if (v<0) dr = -v; else cr = v; } }
      else { const o = parseAmt(r[c.dr]), n = parseAmt(r[c.cr]); dr = isFinite(o) ? Math.abs(o) : 0; cr = isFinite(n) ? Math.abs(n) : 0; }
      const bal = c.bal>=0 ? parseAmt(r[c.bal]) : NaN;
      if (!date || (!dr && !cr)){ bad.push(i); return; }
      const ref = c.ref>=0 ? String(r[c.ref]).trim() : "";
      out.push({date, desc, ref, dr, cr, balance: isFinite(bal) ? bal : null, hash: ref && ref.length >= 6 ? `${acct.id}|ref|${ref}` : lineHash(acct.id, date, desc, dr, cr, isFinite(bal)?bal:null)});
    });
    const rows = withOccurrence(out), have = new Set(S.bl.map(l=>l.hash));
    return {rows, fresh: rows.filter(r=>!have.has(r.hash)), dup: rows.filter(r=>have.has(r.hash)).length, bad: bad.length, c};
  };
  const preview = () => {
    const P = parse();
    $("#uPrev").innerHTML = `<div class="banner">${P.fresh.length} new line${P.fresh.length===1?"":"s"} ready${P.dup?` · ${P.dup} already uploaded (will be skipped)`:""}${P.bad?` · ${P.bad} row${P.bad===1?"":"s"} ignored (no valid date or amount, e.g. headers or totals)`:""}</div>
      <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Description</th><th class="n">Out</th><th class="n">In</th><th class="n">Balance</th></tr></thead><tbody>
      ${P.rows.slice(0,8).map(r=>`<tr><td class="n" style="text-align:left">${fmtDate(r.date)}</td><td>${h(r.desc)}</td><td class="n">${r.dr?money(r.dr):""}</td><td class="n">${r.cr?money(r.cr):""}</td><td class="n">${r.balance!=null?money(r.balance):""}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No usable lines with these settings. Check the Date and amount columns.</td></tr>`}
      </tbody></table></div>`;
    $("#uGo").disabled = !P.fresh.length;
    if (P.c.date<0 || P.c.desc<0) $("#uGo").disabled = true;
    return P;
  };
  document.querySelectorAll("#uMap select").forEach(s => s.onchange = preview);
  preview();
  $("#uGo").onclick = async () => {
    const P = preview(); if (!P.fresh.length) return;
    $("#uGo").disabled = true; const batch = "b" + Date.now(), base = Date.now()*1000;
    try {
      const ids = P.fresh.map(() => newId());
      await S.db.bulk("bankLines", P.fresh.map((r,i) => ({id:ids[i], data:{accountId:acct.id, date:r.date, desc:r.desc, ref:r.ref, dr:r.dr, cr:r.cr, balance:r.balance, hash:r.hash, seq:base+i, batchId:batch, matchKey:"", importedAt:new Date().toISOString()}})),
        (d,t) => $("#uProg").textContent = `Saving ${d} of ${t}…`);
      await loadAll();
      let n = 0; if ($("#uAuto")?.checked) n = await autoMatch(acct.id);
      await loadAll(); $("#ovHost").innerHTML = ""; S.blf = "all"; render();
      toast(`${P.fresh.length} lines imported${n?` · ${n} matched automatically`:""}`); logEvent("Bank statement uploaded", `${acct.code}: ${P.fresh.length} lines`);
      openRecord(acct.id, new Set(ids));
    } catch(x){ $("#uErr").textContent = "Upload failed: " + (x.message || "try again"); $("#uGo").disabled = false; }
  };
}

/* ---------- import from the Excel template ---------- */
const PAYOUTS = ["Monthly","Quarterly","Semi-annual","Annual","At maturity"];
const IMP = {
  bank: {title:"Bank accounts", names:["bank accounts","banks"], cols:{code:"account id", name:"account name", bankName:"bank", number:"account number", currency:"currency", openBal:"statement opening balance", openDate:"opening balance date", notes:"notes"}},
  sh:   {title:"Shareholders", names:["shareholders","share capital","owners"], cols:{code:"shareholder id", name:"name", contact:"contact", shares:"number of shares", notes:"notes"}},
  biz:  {title:"Ventures", names:["ventures","businesses","business"], cols:{code:"business id", name:"business name", nature:"nature of business", address:"address", contact:"contact person", phone:"phone", email:"email", rate:"expected profit rate %", startDate:"start date", mode:"mode of investment", status:"status", notes:"notes"}},
  pl:   {title:"Placements", names:["placements","investors","investor placements"], cols:{code:"placement id", investor:"investor name", contact:"investor contact", ven:"venture id", amount:"amount", rate:"agreed profit rate %", date:"placement date", maturity:"maturity date", frequency:"profit payout", mode:"mode of investment", method:"payment method", bank:"bank account id", status:"status", notes:"notes"}},
  led:  {title:"Ledger", names:["ledger","ledger entries","transactions"], cols:{date:"date", type:"transaction type", ven:"venture id", plc:"placement id", sh:"shareholder id", amount:"amount", method:"payment method", bank:"bank account id", ref:"reference"}},
  bl:   {title:"Bank statement", names:["bank statement","bank statements","statement"], cols:{acct:"account id", date:"date", desc:"description", ref:"reference", dr:"money out", cr:"money in", balance:"balance"}}
};
function readSheet(wb, spec){
  const name = wb.SheetNames.find(n => spec.names.includes(normH(n)));
  if (!name) return null;
  const rows = sheetRows(wb.Sheets[name]); const keys = Object.values(spec.cols);
  const hi = rows.findIndex((r,i) => i<20 && r.map(normH).filter(x=>keys.includes(x)).length >= 2);
  if (hi < 0) return {name, rows:[], missing:true};
  const H = rows[hi].map(normH), idx = {};
  for (const [f, k] of Object.entries(spec.cols)) idx[f] = H.indexOf(k);
  const out = [];
  rows.slice(hi+1).forEach((r, i) => {
    const first = r.find(c => String(c).trim() !== "");
    if (first === undefined) return;
    if (/^e\.?g\.?\b/i.test(String(first).trim())) return;
    const o = {_row: hi + 2 + i}; for (const [f, j] of Object.entries(idx)) o[f] = j >= 0 ? (typeof r[j] === "string" ? r[j].trim() : r[j]) : "";
    out.push(o);
  });
  return {name, rows: out};
}
function analyzeWorkbook(wb){
  const E = [], err = (sh, row, msg) => E.push({sh, row, msg});
  const st = {}, ops = {bank:[], sh:[], biz:[], pl:[], led:[], bl:[]}, now = new Date().toISOString(), batch = "imp" + Date.now();
  const lc = v => String(v ?? "").trim().toLowerCase();
  const maps = { sh: new Map(S.sh.map(x=>[lc(x.code), x.id])), bank: new Map(S.bank.map(x=>[lc(x.code), x.id])), biz: new Map(S.biz.map(x=>[lc(x.code), x.id])), pl: new Map(S.pl.map(x=>[lc(x.code), x])) };
  const found = {};
  const strip = r => { const {id, ...d} = r; return d; };
  // 1. bank accounts
  const run = (key, fn) => { const sh = readSheet(wb, IMP[key]); found[key] = !!sh; st[key] = {read:0, add:0, upd:0, skip:0, err:0, sheet: sh?.name || IMP[key].title};
    if (!sh) return; if (sh.missing){ err(IMP[key].title, 1, "Header row not recognised. Keep the column titles from the template."); return; }
    const seen = new Set(); for (const r of sh.rows){ st[key].read++; const before = E.length; fn(r, seen, st[key]); if (E.length > before) st[key].err++; } };
  run("bank", (r, seen, s) => {
    const T = "Bank accounts", code = String(r.code||"").trim();
    if (!code) return err(T, r._row, "Account ID is required.");
    if (seen.has(lc(code))) return err(T, r._row, `Account ID ${code} appears more than once.`); seen.add(lc(code));
    if (!String(r.name||"").trim()) return err(T, r._row, "Account name is required.");
    const ob = r.openBal===""||r.openBal==null ? 0 : parseAmt(r.openBal); if (!isFinite(ob)) return err(T, r._row, "Statement opening balance is not a number.");
    const od = r.openDate ? parseDateAny(r.openDate) : ""; if (r.openDate && !od) return err(T, r._row, "Opening balance date is not a valid date.");
    const ex = S.bank.find(x=>lc(x.code)===lc(code)), id = ex?.id || newId();
    ops.bank.push({id, data:{...(ex?strip(ex):{createdAt:now}), code, name:String(r.name).trim(), bankName:String(r.bankName||"").trim(), number:String(r.number||"").trim(), currency:String(r.currency||"AED").trim().toUpperCase(), openBal:ob, openDate:od, notes:String(r.notes||""), updatedAt:now}});
    maps.bank.set(lc(code), id); ex ? s.upd++ : s.add++;
  });
  run("sh", (r, seen, s) => {
    const T = "Shareholders", code = String(r.code||"").trim();
    if (!code) return err(T, r._row, "Shareholder ID is required.");
    if (seen.has(lc(code))) return err(T, r._row, `Shareholder ID ${code} appears more than once.`); seen.add(lc(code));
    if (!String(r.name||"").trim()) return err(T, r._row, "Name is required.");
    const sh = r.shares===""||r.shares==null ? "" : parseAmt(r.shares); if (sh!=="" && !isFinite(sh)) return err(T, r._row, "Number of shares is not a number.");
    const ex = S.sh.find(x=>lc(x.code)===lc(code)), id = ex?.id || newId();
    ops.sh.push({id, data:{...(ex?strip(ex):{createdAt:now}), code, name:String(r.name).trim(), contact:String(r.contact||""), shares:sh, notes:String(r.notes||""), updatedAt:now}});
    maps.sh.set(lc(code), id); ex ? s.upd++ : s.add++;
  });
  const vkey = n => sigWords(n).sort().join(" ");
  const findVen = (code, name) => {
    const byCode = S.biz.find(x=>lc(x.code)===lc(code));
    const k = vkey(name), byName = S.biz.filter(x => { const sx = sigWords(x.name); return lc(x.name)===lc(name) || (k && sx.length && (vkey(x.name)===k || sx.every(w=>k.split(" ").includes(w)) || k.split(" ").every(w=>sx.includes(w)))); });
    if (byCode && (lc(byCode.name)===lc(name) || byName.includes(byCode))) return byCode;
    if (byName.length === 1) return byName[0];
    return byCode || null;
  };
  run("biz", (r, seen, s) => {
    const T = "Ventures", code = String(r.code||"").trim();
    if (!code) return err(T, r._row, "Business ID is required.");
    if (seen.has(lc(code))) return err(T, r._row, `Business ID ${code} appears more than once.`); seen.add(lc(code));
    const name = String(r.name||"").trim(); if (!name) return err(T, r._row, "Business name is required.");
    const ex = findVen(code, name);
    const rate = r.rate===""||r.rate==null ? null : parseRate(r.rate); if (rate!==null && !isFinite(rate)) return err(T, r._row, "Expected profit rate % is not a number.");

    const mode = r.mode ? pickOpt(r.mode, MODES) : ""; if (mode===null) return err(T, r._row, `Mode of investment must be one of: ${MODES.join(", ")}.`);
    const status = r.status ? pickOpt(r.status, ["Active","Pipeline","Exited"]) : ""; if (status===null) return err(T, r._row, "Status must be Active, Pipeline or Exited.");
    const sd = r.startDate ? parseDateAny(r.startDate) : ""; if (r.startDate && !sd) return err(T, r._row, "Start date is not a valid date.");
    const id = ex?.id || newId();
    const given = {nature:String(r.nature||"").trim(), address:String(r.address||"").trim(), contact:String(r.contact||"").trim(), phone:String(r.phone||"").trim(), email:String(r.email||"").trim(), startDate:sd, mode, status, notes:String(r.notes||"").trim()};
    if (rate!==null) given.rate = rate;
    const keep = Object.fromEntries(Object.entries(given).filter(([,v]) => v!=="" && v!=null));
    const data = ex ? {...strip(ex), ...keep, updatedAt:now} : {code, name, nature:"", address:"", contact:"", phone:"", email:"", startDate:"", mode:"", status:"Active", notes:"", ...keep, rate, example:false, createdAt:now, updatedAt:now};
    ops.biz.push({id, data, note: ex ? `${code} → ${ex.code} · ${ex.name}` : ""});
    maps.biz.set(lc(code), id); maps.biz.set(lc(name), id); ex ? s.upd++ : s.add++;
  });
  const bankRef = (T, row, v) => { if (!String(v||"").trim()) return ""; const id = maps.bank.get(lc(v)); if (!id){ err(T, row, `Bank account ID ${v} not found. Add it on the Bank accounts sheet or in the Bank tab.`); return null; } return id; };
  run("pl", (r, seen, s) => {
    const T = "Placements", code = String(r.code||"").trim();
    if (!code) return err(T, r._row, "Placement ID is required.");
    if (seen.has(lc(code))) return err(T, r._row, `Placement ID ${code} appears more than once.`); seen.add(lc(code));

    const bizId = maps.biz.get(lc(r.ven)); if (!bizId) return err(T, r._row, r.ven ? `Venture ID ${r.ven} not found on the Ventures sheet or in the system.` : "Venture ID is required.");

    const frequency = r.frequency ? pickOpt(r.frequency, PAYOUTS) : "Quarterly"; if (frequency===null) return err(T, r._row, `Profit payout must be one of: ${PAYOUTS.join(", ")}.`);
    const mode = r.mode ? pickOpt(r.mode, MODES) : ""; if (mode===null) return err(T, r._row, `Mode of investment must be one of: ${MODES.join(", ")}.`);
    const method = r.method ? pickOpt(r.method, METHODS) : "Bank transfer"; if (method===null) return err(T, r._row, `Payment method must be one of: ${METHODS.join(", ")}.`);
    const bankId = bankRef(T, r._row, r.bank); if (bankId===null) return;

    const data = {...(ex?strip(ex):{createdAt:now}), code, investor:String(r.investor).trim(), contact:String(r.contact||""), bizId, amount, rate, date, maturity:mat, frequency, mode, method, bankId, status, notes:String(r.notes||""), example:false, updatedAt:now};
    ops.pl.push({id, data}); maps.pl.set(lc(code), {id, ...data}); ex ? s.upd++ : s.add++;
  });
  const lkey = t => `${t.date}|${t.type}|${t.bizId||""}|${t.placementId||""}|${num(t.amount).toFixed(2)}|${lc(t.ref)}`;
  const haveLed = {}; for (const t0 of S.led){ const t = {...t0, amount: num(t0.amount)/VX()}; const k = lkey(t); haveLed[k] = (haveLed[k]||0) + 1; }

/* ---------- PDF bank statements (Wio Bank layout: Date · Ref · Description · Amount · Balance) ---------- */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function ensurePdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = PDFJS + "pdf.min.js";
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; res(pdfjsLib); };
    s.onerror = () => rej(new Error("The PDF reader didn't load. Check your internet connection and try again.")); document.head.appendChild(s); });
}
async function pdfLines(file){
  const lib = await ensurePdfJs();
  const pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const out = [];
  for (let n = 1; n <= pdf.numPages; n++){
    const page = await pdf.getPage(n), tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width}));
    const rows = [];
    for (const it of items.sort((a,b)=>b.y-a.y || a.x-b.x)){
      let r = rows.find(r => Math.abs(r.y - it.y) < 2.5); if (!r){ r = {y:it.y, items:[]}; rows.push(r); } r.items.push(it);
    }
    for (const r of rows.sort((a,b)=>b.y-a.y)){
      const its = r.items.sort((a,b)=>a.x-b.x), cells = [];
      for (const it of its){ const last = cells[cells.length-1];
        if (last && it.x - (last.x2) < 6) { last.s += (it.x - last.x2 > 0.8 ? " " : "") + it.s; last.x2 = it.x + it.w; }
        else cells.push({s:it.s, x:it.x, x2:it.x + it.w}); }
      out.push({page:n, cells: cells.map(c => ({s:c.s.trim(), x:c.x})).filter(c=>c.s), text: cells.map(c=>c.s.trim()).join("  ")});
    }
  }
  return out;
}
const NUMRE = /^-?\(?[\d,]+(\.\d+)?\)?$/;
function parseStatementPdf(lines){
  const tx = [], info = {};
  const all = lines.map(l => l.text).join("\n");
  let m = /FROM\s+(\d{2}\/\d{2}\/\d{4})\s+TO\s+(\d{2}\/\d{2}\/\d{4})/i.exec(all); if (m){ info.from = parseDateAny(m[1]); info.to = parseDateAny(m[2]); }
  m = /\b(AE\d{21})\b/.exec(all.replace(/\s+/g," ")); if (m) info.iban = m[1];
  m = /ACCOUNT NUMBER[\s\S]{0,80}?\b(\d{8,16})\b/i.exec(all); if (m) info.number = m[1];
  m = /\b(AED|USD|EUR|GBP|SAR|PKR)\b/.exec(all); if (m) info.currency = m[1];
  const oi = lines.findIndex(l => /OPENING BALANCE/i.test(l.text) && /CLOSING BALANCE/i.test(l.text));
  if (oi >= 0) for (const l of lines.slice(oi+1, oi+8)){ const nums = l.cells.map(c=>c.s).filter(s => NUMRE.test(s) && /\d/.test(s)); if (nums.length >= 2){ info.open = parseAmt(nums[0]); info.close = parseAmt(nums[1]); break; } }
  const bankName = /wio bank/i.test(all) ? "Wio Bank" : ""; if (bankName) info.bank = bankName;
  for (const l of lines){
    const c = l.cells.map(x => x.s); if (c.length < 4) continue;
    const date = /^\d{2}\/\d{2}\/\d{4}$/.test(c[0]) ? parseDateAny(c[0]) : ""; if (!date) continue;
    const nums = []; let k = c.length - 1;
    while (k > 0 && nums.length < 2 && NUMRE.test(c[k].replace(/\s/g,"")) && /\d/.test(c[k])) { nums.unshift(c[k]); k--; }
    if (nums.length < 2) continue;
    const mid = c.slice(1, k+1); let ref = "";
    if (mid.length > 1 && /^[A-Z]{0,3}\d{5,}$/.test(mid[0])) ref = mid.shift();
    const amt = parseAmt(nums[0].replace(/[()]/g, m => m==="(" ? "-" : "")), bal = parseAmt(nums[1]);
    if (!isFinite(amt) || !amt) continue;
    tx.push({date, ref, desc: mid.join(" ").replace(/\s+/g," ").trim(), dr: amt < 0 ? -amt : 0, cr: amt > 0 ? amt : 0, balance: isFinite(bal) ? bal : null});
  }
  // checks: running balance and opening → closing
  let run = info.open, breaks = 0;
  if (isFinite(run)) for (const t of tx){ run = Math.round((run + t.cr - t.dr)*100)/100; if (t.balance != null && Math.abs(run - t.balance) > 0.01) { breaks++; run = t.balance; } }
  info.sumOk = isFinite(info.open) && isFinite(info.close) ? Math.abs(info.open + tx.reduce((s,t)=>s+t.cr-t.dr,0) - info.close) < 0.01 : null;
  info.breaks = breaks;
  return {tx, info};
}

/* ---------- record unmatched bank lines: suggestions + remembered rules ---------- */
const IN_TYPES = ["Profit Received","Investment Withdrawal","Owner Capital Contribution","Other Income"];
const OUT_TYPES = ["Operating Expense","Accrued Expense Paid","Investment Addition","Investor Profit Paid","Investor Capital Repaid","Owner Drawing"];
const GENERIC = new Set(["fund","group","fze","fzco","llc","ltd","limited","trading","company","co","the","and","pvt","private","smc","general","holding","holdings","investment","investments","global","solution","solutions"]);
const ruleKey = d => String(d||"").toLowerCase().replace(/\(rate:[^)]*\)/g,"").replace(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\b/g,"").replace(/[0-9]+/g,"").replace(/[^a-z& ]+/g," ").replace(/\s+/g," ").trim();
const sigWords = s => String(s||"").toLowerCase().replace(/[^a-z ]+/g," ").split(/\s+/).filter(w => w.length >= 4 && !GENERIC.has(w));
function suggest(line){
  const amt = lineAmt(line), d = String(line.desc||""), dl = d.toLowerCase(), rk = ruleKey(d);
  const rule = (S.cfg.bankRules || {})[rk];
  if (rule && (amt>0 ? IN_TYPES : OUT_TYPES).includes(rule.type)) return {...rule, why:"Same as last time"};
  if (amt < 0 && /\bfee\b|charge|subscription|commission|\bvat\b|foreign exchange/.test(dl)) return {type:"Operating Expense", why:"Bank fee / charge"};
  const party = dl.replace(/^(from|to)\s+/,"").replace(/^salary from\s+/,"");
  const ven = S.biz.find(b => sigWords(b.name).some(w => party.includes(w)));
  if (ven) return amt > 0 ? {type:"Profit Received", bizId:ven.id, why:`Looks like ${ven.name}`} : {type:"Investment Addition", bizId:ven.id, why:`Looks like ${ven.name}`};
  const inv = S.pl.filter(p => sigWords(p.investor).length && sigWords(p.investor).every(w => party.includes(w)));
  if (inv.length === 1 && amt < 0) return {type:"Investor Profit Paid", placementId:inv[0].id, bizId:inv[0].bizId, why:`Looks like ${inv[0].investor}`};
  if (inv.length && amt > 0) return {type:"", hint:`Looks like investor ${inv[0].investor}. If this is a new placement, add it under Investors and then use Match.`};
  if (/^salary/i.test(d) && amt > 0) return {type:"Other Income", why:"Salary credit"};
  return {type:""};
}

/* ---------- owner capital: income split and Share capital tab ---------- */
/* Each venture's profit is split between owner capital and investor capital in proportion to the capital
   each has deployed in that venture at the end of the period. */
function incomeSplit(from, to){
  let own = 0, inv = 0; const rows = [];
  const mixAt = (bizId, d) => { const f = t => t.bizId===bizId;
    const net = Math.max(0, tsum("Investment Addition",ORIGIN,d,f) - tsum("Investment Withdrawal",ORIGIN,d,f) + tsum("Profit Reinvested",ORIGIN,d,f));
    const icap = Math.max(0, placed(ORIGIN,d,p=>p.bizId===bizId) - tsum("Investor Capital Repaid",ORIGIN,d,f));
    const invDep = Math.min(icap, net); return {net, invDep, ownCap: net - invDep}; };
  for (const b of S.biz){
    let o = 0, i2 = 0, acc = 0;
    for (const t of S.led){ if (t.type!=="Profit Accrued" || t.bizId!==b.id || t.date<from || t.date>to) continue;
      const a = num(t.amount); acc += a;
      if (t.ownPart!=null && t.ownPart!=="") { o += num(t.ownPart); i2 += a - num(t.ownPart); }
      else { const m = mixAt(b.id, t.date); const sh = m.net > 0 ? m.ownCap/m.net : 1; o += a*sh; i2 += a*(1-sh); } }
    const m = mixAt(b.id, to);
    own += o; inv += i2; rows.push({b, acc, net:m.net, ownCap:m.ownCap, invDep:m.invDep, own:o, inv:i2, shOwn: m.net>0 ? m.ownCap/m.net : 1});
  }
  const hq = tsum("Profit Accrued", from, to, t => !t.bizId); own += hq;
  return {own, inv, rows};
}

/* ---------- automatic profit accruals from rates ----------
   Venture profit   = venture expected rate × net capital invested in the venture, day by day
   Investor profit  = agreed rate × placement outstanding, day by day (from the day after placement, until maturity)
   Future Axis keeps the difference on investor money plus the full venture profit on paid-up capital. */
const monthEnd = ym => { const [y,m] = ym.split("-").map(Number); return iso(new Date(y, m, 0)); };
const monthLabel = ym => { const [y,m] = ym.split("-").map(Number); return new Date(y, m-1, 1).toLocaleDateString("en-GB",{month:"short", year:"numeric"}); };
function accrualStart(){
  const ds = [...S.pl.map(p=>p.date), ...S.led.filter(t=>t.type==="Investment Addition").map(t=>t.date)].filter(Boolean).sort();
  return ds[0] ? ds[0].slice(0,7) : "";
}
function monthsBetween(a, b){ const out = []; if (!a || !b || a > b) return out; let [y,m] = a.split("-").map(Number); const [by,bm] = b.split("-").map(Number);
  while (y < by || (y===by && m<=bm)){ out.push(`${y}-${pad(m)}`); m++; if (m>12){ m=1; y++; } } return out; }
function stepSeries(events){ // events: [{date, amt}] → f(d) = sum of amt with date <= d
  const ev = events.filter(e=>e.date && e.amt).sort((a,b)=>a.date.localeCompare(b.date));
  return d => { let s = 0; for (const e of ev){ if (e.date > d) break; s += e.amt; } return s; };
}
function accrueOwn(rate, venAt, invAt, from, to){
  if (!rate) return 0; let s = 0;
  for (let d = from; d <= to; d = addDays(d, 1)){ const prev = addDays(d, -1), v = Math.max(0, venAt(prev)); s += v - Math.min(Math.max(0, invAt(prev)), v); }
  return s * rate / 365;
}
function accrueDaily(rate, balAt, from, to, stop){
  if (!rate) return 0; let s = 0;
  for (let d = from; d <= to; d = addDays(d, 1)){ const prev = addDays(d, -1); if (stop && prev >= stop) break; s += Math.max(0, balAt(prev)); }
  return s * rate / 365;
}
function computeAccruals(through){
  const months = monthsBetween(accrualStart(), through).filter(m => !S.cfg.closedTo || m > S.cfg.closedTo), out = [];
  const isAuto = t => t.auto;
  const gen = t => t.auto && (t.type==="Profit Reinvested" || (t.type==="Profit Received" && String(t.id).startsWith("auto-c-")));
  const venEv = Object.fromEntries(S.biz.map(b => [b.id, S.led.filter(t=>t.bizId===b.id && !gen(t) && (t.type==="Investment Addition"||t.type==="Investment Withdrawal"||t.type==="Profit Reinvested"||(isReinvest(b) && t.type==="Profit Received"))).map(t=>({date:t.date, amt: t.type==="Investment Withdrawal"||t.type==="Profit Received" ? -num(t.amount) : num(t.amount)}))]));
  const venSeries = {};
  const invInVen = Object.fromEntries(S.biz.map(b => [b.id, stepSeries([...S.pl.filter(p=>p.bizId===b.id).map(p=>({date:p.date, amt:num(p.amount)})), ...S.led.filter(t=>t.bizId===b.id && t.type==="Investor Capital Repaid").map(t=>({date:t.date, amt:-num(t.amount)}))])]));
  const plSeries = Object.fromEntries(S.pl.map(p => [p.id, stepSeries([{date:p.date, amt:num(p.amount)}, ...S.led.filter(t=>t.placementId===p.id && t.type==="Investor Capital Repaid").map(t=>({date:t.date, amt:-num(t.amount)}))])]));
  for (const ym of months){
    const from = ym + "-01", to = monthEnd(ym);
    for (const b of S.biz){ venSeries[b.id] = stepSeries(venEv[b.id]); const a = Math.round(accrueDaily(num(b.rate), venSeries[b.id], from, to) * 100) / 100;
      const own = Math.min(a, Math.round(accrueOwn(num(b.rate), venSeries[b.id], invInVen[b.id], from, to) * 100) / 100);
      if (a) out.push({id:`auto-v-${b.id}-${ym}`, ym, kind:"v", data:{date:to, type:"Profit Accrued", bizId:b.id, placementId:"", amount:a, ownPart:own, method:"", bankId:"", ref:`Auto accrual ${monthLabel(ym)} at ${(num(b.rate)*100).toFixed(2)}% p.a.`, auto:true, accrualMonth:ym, example:false}});
      /* compounding: the month's profit stays receivable and earns profit from the next day; withdrawals reduce the receivable first */
      if (a && isReinvest(b)) venEv[b.id].push({date:to, amt:a});
      /* paid out monthly: the month's profit is received at month end (unless a receipt was already recorded) */
      if (a && isPaidOut(b) && !S.led.some(t=>!t.auto && t.type==="Profit Received" && t.bizId===b.id && t.date>=from && t.date<=addDays(to,20)))
        out.push({id:`auto-c-${b.id}-${ym}`, ym, kind:"c", data:{date:to, type:"Profit Received", bizId:b.id, placementId:"", amount:a, method:"Bank transfer", bankId:"", ref:`Profit for ${monthLabel(ym)} received from ${b.name}`, auto:true, accrualMonth:ym, example:false}}); }
    for (const p of S.pl){ if (!p.date || p.date > to) continue;
      const a = Math.round(accrueDaily(num(p.rate), plSeries[p.id], from, to, p.maturity || "") * 100) / 100;
      if (a) out.push({id:`auto-p-${p.id}-${ym}`, ym, kind:"p", data:{date:to, type:"Investor Profit Accrued", bizId:p.bizId, placementId:p.id, amount:a, method:"", bankId:"", ref:`Auto accrual ${monthLabel(ym)} at ${(num(p.rate)*100).toFixed(2)}% p.a.`, auto:true, accrualMonth:ym, example:false}}); }
  }
  const manual = S.led.filter(t => !isAuto(t) && (t.type==="Profit Accrued"||t.type==="Investor Profit Accrued") && t.date && months.includes(t.date.slice(0,7)));
  out.sort((x,y)=>({v:0,r:1,c:2,p:3}[x.kind]) - ({v:0,r:1,c:2,p:3}[y.kind]));
  const stale = S.led.filter(t => isAuto(t) && months.includes(t.accrualMonth) && !out.some(o=>o.id===t.id));
  return {months, out, manual, stale};
}

  const k = venKey(name), m = S.biz.filter(x => { const sx = sigWords(x.name); return normH(x.name)===normH(name) || (k && sx.length && (venKey(x.name)===k || sx.every(w=>k.split(" ").includes(w)) || k.split(" ").every(w=>sx.includes(w)))); });
  return m.length === 1 ? m[0] : (m.find(x=>normH(x.name)===normH(name)) || null);

/* read the sheet into editable rows */
function parseInvestorSheet(wb){
  const sh = findSimpleSheet(wb); if (!sh) return null;
  const {rows, hi, H, raw} = sh;
  const iSr = H.findIndex(x=>/^(sr|s no|no|serial)\b/.test(x)), iInv = H.findIndex(x=>x.includes("investor") && !x.includes("rate"));
  const iRate = H.findIndex(x=>x.includes("rate")), iDate = H.findIndex(x=>x.includes("date")), iAmt = H.findIndex(x=>/investment|amount/.test(x) && !x.includes("rate"));
  const cur = /\baed\b/.test(H[iAmt]) ? "AED" : /\busd\b/.test(H[iAmt]) ? "USD" : BASE();
  const vcols = H.map((x,i)=>({i, name: raw[i]})).filter(c => c.i > iAmt && c.name && !/total|note|remark|comment/i.test(c.name));
  const recs = [], skipped = [];
  rows.slice(hi+1).forEach((r, k) => {
    const inv = String(r[iInv] ?? "").trim(); if (!inv) return;
    const amt = parseAmt(r[iAmt]); if (!(amt > 0)){ skipped.push(`${iSr>=0 && String(r[iSr]).trim() ? "Sr. "+String(r[iSr]).trim()+" " : ""}${inv}: amount is zero`); return; }
    const rate = r[iRate]==="" || r[iRate]==null ? 0 : parseRate(r[iRate]);
    const alloc = {}; for (const c of vcols){ const v = parseAmt(r[c.i]); alloc[c.name] = isFinite(v) ? v : 0; }
    recs.push({sr: iSr>=0 ? String(r[iSr]).trim() : String(recs.length+1), inv, rate: isFinite(rate) ? +(rate*100).toFixed(4) : "", date: parseDateAny(r[iDate]), amt, alloc, owner: OWNER_HINT.test(inv) || S.sh.some(s=>normH(s.name)===normH(inv))});
  });
  return {kind:"simple", file:"", sheet:sh.name, cur, ventures: vcols.map(c=>c.name), recs, skipped};
}
/* validate the (possibly edited) rows and prepare what will be saved */
function buildInvestorImport(P){
  const E = [], W = [...P.skipped.map(x=>`Skipped ${x}.`)], now = new Date().toISOString(), batch = "imp" + Date.now();
  const ops = {bank:[], sh:[], biz:[], pl:[], led:[], bl:[]}; const toBase = v => conv(v, P.cur, BASE());
  let vn = Math.max(0, ...S.biz.map(x=>parseInt(String(x.code||"").replace(/\D/g,""))||0)), sn = Math.max(0, ...S.sh.map(x=>parseInt(String(x.code||"").replace(/\D/g,""))||0));
  const venOf = {}, shOf = {}, linked = [];
  const firstDate = {}; for (const x of P.recs) for (const [v,a] of Object.entries(x.alloc)) if (a > 0 && x.date && (!firstDate[v] || x.date < firstDate[v])) firstDate[v] = x.date;
  const ensureVen = name => { if (venOf[name]) return venOf[name]; const ex = findVenByName(name);
    if (ex){ if (normH(ex.name)!==normH(name)) linked.push(`${name} → ${ex.name}`); return venOf[name] = ex; }
    const v = {id:newId(), code:"V"+String(++vn).padStart(3,"0"), name};
    ops.biz.push({id:v.id, data:{code:v.code, name, nature:"", address:"", contact:"", phone:"", email:"", rate:0, startDate:firstDate[name]||"", mode:"", status:"Active", notes:"", example:false, createdAt:now, updatedAt:now}});
    W.push(`New venture “${name}” will be created. Set its expected profit rate in Ventures afterwards.`); return venOf[name] = v; };
  const ensureSh = n => { if (shOf[n]) return shOf[n]; const ex = S.sh.find(s=>normH(s.name)===normH(n)); if (ex) return shOf[n] = ex;
    const v = {id:newId(), code:"S"+String(++sn).padStart(3,"0"), name:n}; ops.sh.push({id:v.id, data:{code:v.code, name:n, contact:"", shares:"", notes:"", createdAt:now, updatedAt:now}}); return shOf[n] = v; };
  const plByCode = new Map(S.pl.map(p=>[String(p.code).toLowerCase(), p]));
  let owner = 0, investor = 0, nPl = 0;
  P.recs.forEach((x, idx) => {
    const lab = `${x.sr ? "Sr. "+x.sr+" · " : ""}${x.inv || "(no name)"}`; const before = E.length;
    if (!String(x.inv||"").trim()) E.push({i:idx, msg:`${lab}: investor name is missing.`});
    if (!x.date) E.push({i:idx, msg:`${lab}: placement date is missing.`});
    if (!(num(x.amt) > 0)) E.push({i:idx, msg:`${lab}: amount must be more than zero.`});
    if (!x.owner && (x.rate==="" || !isFinite(+x.rate))) E.push({i:idx, msg:`${lab}: profit rate is missing.`});
    const parts = Object.entries(x.alloc).filter(([,a]) => num(a) > 0.004);
    const sum = parts.reduce((s,[,a])=>s+num(a),0);
    if (!parts.length) E.push({i:idx, msg:`${lab}: allocate the amount to at least one venture.`});
    else if (Math.abs(sum - num(x.amt)) > 0.01) E.push({i:idx, msg:`${lab}: allocations add up to ${nf.format(sum)} but the amount is ${nf.format(num(x.amt))}.`});
    if (E.length > before) return;
    const key = x.sr || `R${idx+1}`;
    if (x.owner){
      const s = ensureSh(x.inv.trim()); owner += toBase(num(x.amt));
      ops.led.push({id:`imp-own-${key}`, data:{date:x.date, type:"Owner Capital Contribution", bizId:"", placementId:"", shareholderId:s.id, amount:toBase(num(x.amt)), method:"Bank transfer", bankId:"", ref:`${x.inv.trim()} paid-up capital (Sr. ${key})`, example:false, createdAt:now, updatedAt:now, importBatch:batch}});
      for (const [vname, a] of parts){ const v = ensureVen(vname);
        ops.led.push({id:`imp-own-${key}-${v.code}`, data:{date:x.date, type:"Investment Addition", bizId:v.id, placementId:"", shareholderId:"", amount:toBase(num(a)), method:"Bank transfer", bankId:"", ref:`Allocation of ${x.inv.trim()} capital (Sr. ${key})`, example:false, createdAt:now, updatedAt:now, importBatch:batch}}); }
      return;
    }
    investor += toBase(num(x.amt));
    for (const [vname, a] of parts){
      const v = ensureVen(vname), code = `P${/^\d+$/.test(key) ? key.padStart(3,"0") : key}` + (parts.length > 1 ? `-${v.code}` : "");
      const ex = plByCode.get(code.toLowerCase()), {id:_x, ...exd} = ex || {}; nPl++;
      ops.pl.push({id: ex?.id || newId(), data:{...(ex ? exd : {contact:"", maturity:"", frequency:"Quarterly", mode:"", bankId:"", createdAt:now}), code, investor:x.inv.trim(), bizId:v.id, amount:toBase(num(a)), rate: num(x.rate)/100, date:x.date,
        method: exd.method || "Bank transfer", status: exd.status || "Active", notes: exd.notes || `Investor sheet Sr. ${key}`, example:false, updatedAt:now}});
      ops.led.push({id:`imp-add-${code}`, data:{date:x.date, type:"Investment Addition", bizId:v.id, placementId:"", shareholderId:"", amount:toBase(num(a)), method:"Bank transfer", bankId:"", ref:`Allocation of investor funds ${code} · ${x.inv.trim()}`, example:false, createdAt:now, updatedAt:now, importBatch:batch}});
    }
  });
  const total = Object.values(ops).reduce((s,a)=>s+a.length,0);
  return {E, W, ops, total, batch, owner, investor, nPl, linked, st:{}, found:{}};
}

function portalMonths(){ const st = accrualStart() || todayIso().slice(0,7); return monthsBetween(st, todayIso().slice(0,7)).reverse(); }
function portalRows(ym, cur){
  const to = monthEnd(ym), from = ym + "-01", f = conv(1, VIEW(), cur), by = {};
  for (const p of S.pl){
    if (!p.date || p.date > to || isOwnName(p.investor)) continue;
    const r = by[p.investor] ||= {investor:p.investor, enabled:false, inv:0, month:0, todate:0, paid:0, rates:new Set(), n:0, ids:[]};
    const repaid = S.led.filter(t=>t.placementId===p.id && t.type==="Investor Capital Repaid" && t.date<=to).reduce((s,t)=>s+num(t.amount),0);
    r.inv += (num(p.amount) - repaid)*f; r.n++; r.ids.push(p.id); r.rates.add((num(p.rate)*100).toFixed(2).replace(/\.00$/,""));
    r.enabled = r.enabled || !!p.portal;
    for (const t of S.led){ if (t.placementId!==p.id) continue;
      if (t.type==="Investor Profit Accrued"){ if (t.date>=from && t.date<=to) r.month += num(t.amount)*f; if (t.date<=to) r.todate += num(t.amount)*f; }
      if (t.type==="Investor Profit Paid" && t.date<=to) r.paid += num(t.amount)*f; }
  }
  return Object.values(by).sort((a,b)=>a.investor.localeCompare(b.investor));
}

/* ---------- send email from the system (FormSubmit: no account, no mail app) ---------- */
async function sendEmail(to, cc, subject, fields, attach){
  const payload = {_subject: subject, _template: "table", _captcha: "false", ...fields};
  if (cc) payload._cc = cc;
  let j = {}, withPdf = false;
  const url = `https://formsubmit.co/ajax/${encodeURIComponent(to)}`;
  try {
    if (attach){
      const fd = new FormData(); for (const [k,v] of Object.entries(payload)) fd.append(k, v); (Array.isArray(attach) ? attach : [attach]).forEach((a, i) => fd.append(i ? "attachment" + (i+1) : "attachment", a.blob, a.name));
      const r = await fetch(url, {method:"POST", headers:{"Accept":"application/json"}, body: fd}); j = await r.json().catch(() => ({}));
      withPdf = j.success === true || j.success === "true";
    }
    if (!withPdf && !(attach && /activat/i.test(String(j.message||"")))){
      const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json", "Accept":"application/json"}, body: JSON.stringify(payload)});
      j = await r.json().catch(() => ({}));
    }
  } catch(x){ return {ok:false, msg:"Couldn't reach the email service. Check your internet connection and try again."}; }
  const ok = j.success === true || j.success === "true";
  const activation = !ok && /activat/i.test(String(j.message||""));
  return {ok, activation, to, withPdf, msg: ok ? "Sent" : activation ? `One-time step: an activation email was sent to ${to}. Ask finance to open it and click “Activate Form”, then press Send again.` : (j.message || "The email service didn't accept the message. Try again in a minute.")};
}

const supName = id => S.sup.find(x=>x.id===id)?.name || "";
const cleanDesc = d => String(d||"").replace(/\(rate:[^)]*\)/ig,"").replace(/^to\s+/i,"").replace(/\s+/g," ").trim();
function expSuggest(l){
  const d = String(l.desc||""), dl = d.toLowerCase(), rule = (S.cfg.expRules||{})[ruleKey(d)];
  if (rule) return {...rule, why:"Same as last time"};
  const party = dl.replace(/^to\s+/,"");
  const sup = S.sup.find(x => sigWords(x.name).length && sigWords(x.name).some(w => party.includes(w)));
  if (sup) return {supplierId:sup.id, category: sup.category || "Supplier / service provider", why:`Supplier ${sup.name}`};
  if (/swift|transaction fee|exchange fee|foreign exchange|bank charge|commission/.test(dl)) return {category:"Bank charges", why:"Bank fee"};
  if (/subscription|hubspot|zoho|google|microsoft|adobe|canva|openai|notion/.test(dl)) return {category:"Software & subscriptions", why:"Software"};
  if (/makemytrip|airalo|holafly|airline|hotel|booking|careem|uber|emirates|flydubai|manafeth/.test(dl)) return {category:"Travel", why:"Travel"};
  if (/salary|payroll/.test(dl)) return {category:"Salaries & staff", why:"Salary"};
  return {category:""};
}

async function confirmExpenses(btn){
  const pend = pendingExpenseLines(), sel = pend.filter(l => expQ(l).inc);
  const bad = sel.filter(l => !expQ(l).cat || !(expQ(l).amt > 0));
  if (bad.length){ toast(`${bad.length} line${bad.length===1?" needs":"s need"} a category and an amount`); return; }
  btn.disabled = true; const now = new Date().toISOString(), led = [], upd = [], rules = {...(S.cfg.expRules||{})};
  for (const l of sel){
    const q = expQ(l), ac = acctCur(l.accountId), same = Math.abs(q.amt - (-lineAmt(l))) < 0.005, id = newId();
    led.push({id, data:{date:l.date, type:"Operating Expense", bizId:"", placementId:"", shareholderId:"", supplierId:q.sup, category:q.cat, amount:conv(q.amt, ac, VIEW()), origAmount:q.amt, origCur:ac,
      fxAmount:q.amt, fxCur:ac, method:"Bank transfer", bankId:l.accountId, ref:q.desc + (l.ref ? " · " + l.ref : ""), example:false, createdAt:now, updatedAt:now, fromBankLine:l.id}});
    if (same){ const {id:lid, ...ld} = l; upd.push({id:lid, data:{...ld, matchKey:"led:"+id}}); }
    rules[ruleKey(l.desc)] = {supplierId:q.sup, category:q.cat};
  }
  try {
    await S.db.bulk("ledger", led); if (upd.length) await S.db.bulk("bankLines", upd);
    const {expRules, ...cfg} = S.cfg; await S.db.doc("config/settings").set({...cfg, expRules: rules});
    for (const l of sel) delete S.expQ[l.id];
    await loadAll();
    S.flash.expNote = {color:"var(--pos)", html:`<b>${led.length} expense${led.length===1?"":"s"} recorded</b> in USD${upd.length<led.length?` · ${led.length-upd.length} with an edited amount stay unmatched in Bank`:""}.`};
    render(); toast(`${led.length} expenses recorded`);
  } catch(x){ toast("Could not save: " + (x.message||"try again")); btn.disabled = false; }
}
async function skipNonExpenses(btn){
  const sel = pendingExpenseLines().filter(l => !expQ(l).inc); if (!sel.length){ toast("Untick the lines that aren't expenses first"); return; }
  btn.disabled = true;
  try { await S.db.bulk("bankLines", sel.map(l => { const {id, ...d} = l; return {id, data:{...d, notExpense:true}}; })); toast(`${sel.length} line${sel.length===1?"":"s"} moved out of this list. Record them in Bank → Record unmatched lines.`); }
  catch(x){ toast("Could not save"); btn.disabled = false; }
}

const loadScript = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("The PDF tool didn't load. Check your connection and try again.")); document.head.appendChild(s); });

function pdfFrame(doc, title, sub){
  const W = doc.internal.pageSize.getWidth();
  doc.setFillColor(13,24,56); doc.rect(0, 0, W, 26, "F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.text(S.cfg.entity || "Future Axis Holdings", 14, 12);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text("Investor & venture ledger", 14, 19);
  doc.text(`Prepared ${fmtDate(todayIso())}${S.user?.email ? " · " + S.user.email : ""}`, W-14, 19, {align:"right"});
  doc.setTextColor(14,23,48); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text(title, 14, 40);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(91,102,131); doc.text(sub, 14, 47); doc.setTextColor(14,23,48);
  return 54;
}
const pdfTable = (doc, y, head, body, opts={}) => { doc.autoTable({startY:y, head:[head], body, theme:"grid", styles:{font:"helvetica", fontSize:9.5, cellPadding:2.6, lineColor:[227,232,242], textColor:[14,23,48]},

/* ---------- activity log & backups (Admin and CFO) ---------- */
function logEvent(action, detail, category){
  try { SB.rpc("log_event", {p_action: action, p_detail: detail == null ? null : String(detail), p_category: category || "event"}).then(()=>{}, ()=>{}); } catch(e){}
}
const LOG_AREA = {businesses:"Ventures", placements:"Investors", ledger:"Ledger", bankAccounts:"Bank accounts", bankLines:"Bank statement lines", shareholders:"Share capital", suppliers:"Suppliers", investors:"Investor master", financeLog:"Email history", config:"Settings"};
const LOG_ACT = {insert:["Added","ok"], update:["Changed","warn"], delete:["Deleted","bad"], event:["Event",""]};
const LOG_SKIP = new Set(["updatedAt","createdAt","seq","hash","importedAt","batchId"]);
const LOG_FIELD = {bizId:"Venture", placementId:"Placement", accountId:"Bank account", bankId:"Bank account", supplierId:"Supplier", shId:"Shareholder",
  amount:"Amount (USD)", ownPart:"Paid-up capital share (USD)", origAmount:"Original amount", origCur:"Original currency", fxAmount:"Bank amount", fxCur:"Bank currency",
  rate:"Rate", date:"Date", type:"Type", ref:"Reference", desc:"Description", code:"Code", name:"Name", investor:"Investor", category:"Category", method:"Method",
  matchKey:"Matched to", dr:"Paid out", cr:"Paid in", balance:"Balance", status:"Status", notExpense:"Not an expense"};
const logTime = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
function logVal(k, v){
  if (v === null || v === undefined || v === "") return "–";
  if (k==="bizId") return bizCode(v) + " · " + bizName(v);
  if (k==="placementId") return plLabel(v) || v;
  if (k==="accountId" || k==="bankId") return bankName(v) || v;
  if (k==="supplierId") return supName(v) || v;
  if (k==="rate" && typeof v === "number" && v < 5) return (v*100).toFixed(2) + "%";
  if (k==="date" && /^\d{4}-\d\d-\d\d$/.test(v)) return fmtDate(v);
  if (typeof v === "number") return v.toLocaleString("en-US",{maximumFractionDigits:2});
  if (typeof v === "boolean") return v ? "Yes" : "No";
  if (typeof v === "object") return JSON.stringify(v).slice(0,120);
  return String(v);
}
function logRecLabel(col, d){
  if (!d) return "";
  if (col==="ledger") return [d.type, d.date && fmtDate(d.date), d.bizId && bizCode(d.bizId), d.ref].filter(Boolean).join(" · ");
  if (col==="bankLines") return [d.date && fmtDate(d.date), d.desc].filter(Boolean).join(" · ");
  if (col==="config") return "Settings";
  return [d.code, d.name || d.investor].filter(Boolean).join(" · ");
}
function logDiff(o, n){
  const keys = [...new Set([...Object.keys(o||{}), ...Object.keys(n||{})])].filter(k=>!LOG_SKIP.has(k));
  return keys.map(k => ({k, label: LOG_FIELD[k] || k, a: o ? o[k] : undefined, b: n ? n[k] : undefined}))
             .map(r => ({...r, changed: JSON.stringify(r.a) !== JSON.stringify(r.b)}));
}
function logSummary(r){
  if (r.action==="event") return h(r.detail||"");
  if (r.action==="update"){
    const ch = logDiff(r.old_data, r.new_data).filter(x=>x.changed);
    if (!ch.length) return '<span class="mut">No visible change</span>';
    return ch.slice(0,3).map(x=>`${h(x.label)}: <span class="mut">${h(logVal(x.k,x.a))}</span> → <b>${h(logVal(x.k,x.b))}</b>`).join("<br>") + (ch.length>3?`<br><span class="mut">+${ch.length-3} more</span>`:"");
  }
  const d = r.new_data || r.old_data || {};
  return h(["amount","rate"].filter(k=>d[k]!=null).map(k=>`${LOG_FIELD[k]}: ${logVal(k,d[k])}`).join(" · "));
}
S.lg = {from:"", to:"", area:"", kind:"", who:"", q:"", rows:null, limit:300, loading:false, err:""};
async function loadLogs(){
  const L = S.lg; if (!L.from){ L.to = todayIso(); L.from = addDays(L.to, -30); }
  L.loading = true; L.err = "";
  try {
    let q = SB.from("audit_log").select("id,at,user_email,action,collection,record_id,old_data,new_data,detail,category")
      .gte("at", new Date(L.from+"T00:00:00").toISOString()).lte("at", new Date(L.to+"T23:59:59").toISOString());
    if (L.area) q = q.eq("collection", L.area);
    if (L.kind) q = q.eq("action", L.kind);
    const {data, error} = await q.order("id", {ascending:false}).range(0, L.limit-1);
    if (error) throw error; L.rows = data || [];
  } catch(x){ L.rows = []; L.err = /audit_log/.test(x.message||"") ? "The activity log isn't set up yet. Run the latest schema.sql in Supabase (SQL Editor)." : "Could not load the log: " + (x.message||""); }
  L.loading = false; if (S.tab==="logs" && !$("#ov")) render();
}
function logFiltered(){
  const L = S.lg, q = L.q.trim().toLowerCase(), who = L.who;
  return (L.rows||[]).filter(r => (!who || r.user_email===who) && (!q || JSON.stringify([r.detail, r.record_id, r.old_data, r.new_data, logRecLabel(r.collection, r.new_data||r.old_data)]).toLowerCase().includes(q)));
}
function viewLogs(){
  if (!S.isFull) return `<div class="banner">Only Admin and CFO can see the activity log.</div>`;
  const L = S.lg; if (L.rows === null && !L.loading){ loadLogs(); }
  const rows = logFiltered(), people = [...new Set((L.rows||[]).map(r=>r.user_email).filter(Boolean))].sort();
  const cnt = k => rows.filter(r=>r.action===k).length;
  const tr = rows.map(r => { const [lbl, cls] = LOG_ACT[r.action] || [r.action,""]; const d = r.new_data || r.old_data;
    return `<tr class="click" data-logrow="${r.id}"><td class="nowrap">${h(logTime(r.at))}</td><td>${h(r.user_email || (r.category==="event"&&!r.user_email?"System":""))}</td>
      <td><span class="pill ${cls}">${r.category==="auth"?"Sign-in":lbl}</span></td><td>${h(LOG_AREA[r.collection] || (r.action==="event"?"":r.collection||""))}</td>
      <td>${h(logRecLabel(r.collection, d))}</td><td style="font-size:12.5px;line-height:1.45">${logSummary(r)}</td></tr>`; }).join("");
  S.csv.logs = {head:["When","Who","Action","Area","Record","Field","Before","After","Detail"], rows: rows.flatMap(r => {
    const base = [logTime(r.at), r.user_email||"", (LOG_ACT[r.action]||[r.action])[0], LOG_AREA[r.collection]||r.collection||"", logRecLabel(r.collection, r.new_data||r.old_data)];
    if (r.action==="event") return [[...base, "", "", "", r.detail||""]];
    const ch = logDiff(r.old_data, r.new_data).filter(x => r.action!=="update" || x.changed);
    return ch.length ? ch.map(x => [...base, x.label, logVal(x.k,x.a), logVal(x.k,x.b), ""]) : [[...base,"","","",""]];
  })};
  return `<div class="stack">
  <div class="kpis">
    <div class="kpi"><div class="eyebrow">Entries shown</div><div class="v">${nf.format(rows.length)}</div><div class="s">${fmtDate(L.from)} to ${fmtDate(L.to)}</div></div>
    <div class="kpi"><div class="eyebrow">Added</div><div class="v">${nf.format(cnt("insert"))}</div></div>
    <div class="kpi"><div class="eyebrow">Changed</div><div class="v">${nf.format(cnt("update"))}</div></div>
    <div class="kpi"><div class="eyebrow">Deleted</div><div class="v">${nf.format(cnt("delete"))}</div></div>
  </div>
  <section class="sheet"><div class="sheet-h"><div><h2>Activity log</h2><p>Every record added, changed or deleted, with who did it and the values before and after. The database writes this log itself; nobody can edit or delete it.${S.isAdmin?" Sign-ins are visible to Admin only.":""}</p></div>
    <div class="row"><button class="btn sm" data-logact="refresh">Refresh</button><button class="btn sm" data-csv="logs">Download CSV</button></div></div>
    <div class="sheet-b row" style="flex-wrap:wrap;gap:10px">
      <label class="inl">From <input type="date" id="lgFrom" value="${h(L.from)}"></label>
      <label class="inl">To <input type="date" id="lgTo" value="${h(L.to)}"></label>
      <label class="inl">Area <select id="lgArea"><option value="">All</option>${Object.entries(LOG_AREA).map(([k,v])=>`<option value="${k}" ${L.area===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label class="inl">Action <select id="lgKind"><option value="">All</option>${Object.entries(LOG_ACT).map(([k,v])=>`<option value="${k}" ${L.kind===k?"selected":""}>${k==="event"?"Events":v[0]}</option>`).join("")}</select></label>
      <label class="inl">Who <select id="lgWho"><option value="">Everyone</option>${people.map(p=>`<option ${L.who===p?"selected":""}>${h(p)}</option>`).join("")}</select></label>
      <input id="lgQ" placeholder="Search name, code, amount…" value="${h(L.q)}" style="max-width:240px">
    </div>
    ${L.err?`<div class="sheet-b"><div class="banner">${h(L.err)}</div></div>`:""}
    <div class="tbl"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Area</th><th>Record</th><th>What changed</th></tr></thead>
      <tbody>${L.loading && L.rows===null ? `<tr><td colspan="6" class="empty">Loading…</td></tr>` : tr || `<tr><td colspan="6" class="empty">Nothing in this period.</td></tr>`}</tbody></table></div>
    ${(L.rows||[]).length >= L.limit ? `<div class="sheet-b"><button class="btn sm" data-logact="more">Load more</button></div>` : ""}
  </section></div>`;
}
function openLogRow(id){
  const r = (S.lg.rows||[]).find(x=>String(x.id)===String(id)); if (!r) return;
  const [lbl] = LOG_ACT[r.action] || [r.action];
  const body = r.action==="event" ? `<p>${h(r.detail||"")}</p>` :
    `<div class="tbl"><table><thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead><tbody>${logDiff(r.old_data, r.new_data).map(x=>`<tr${x.changed&&r.action==="update"?' style="background:var(--warn-bg,rgba(234,179,8,.12))"':""}><td>${h(x.label)}</td><td>${h(logVal(x.k,x.a))}</td><td>${x.changed||r.action!=="update"?"<b>":""}${h(logVal(x.k,x.b))}${x.changed||r.action!=="update"?"</b>":""}</td></tr>`).join("")}</tbody></table></div>`;
  $("#ovHost").innerHTML = `<div class="ov" id="ov"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="lgTitle" style="width:min(760px,100%)">
    <div class="row" style="justify-content:space-between"><div><h2 id="lgTitle">${h(lbl)}${r.collection?" · "+h(LOG_AREA[r.collection]||r.collection):""}</h2><p class="note">${h(logTime(r.at))} · ${h(r.user_email||"System")}${r.record_id?" · record "+h(r.record_id):""}</p></div><button class="btn sm" data-close type="button">Close</button></div>
    <div style="margin-top:12px">${body}<p class="note" style="margin-top:10px">Amounts are in the base currency (USD) as stored.</p></div></div></div>`;
  wireClose();
}

function wireClose(){ const close = () => $("#ovHost").innerHTML = ""; document.querySelectorAll("#ov [data-close]").forEach(b=>b.onclick=close); $("#ov").onclick = e => { if (e.target.id==="ov") close(); }; }
/* backups */
S.bk = {rows:null, loading:false, err:"", file:null};
async function loadBackups(){
  S.bk.loading = true; S.bk.err = "";
  try { const {data, error} = await SB.from("backups").select("id,taken_at,taken_by_email,kind,label,row_count,size_bytes").order("taken_at",{ascending:false}).range(0,199);
    if (error) throw error; S.bk.rows = data || []; }
  catch(x){ S.bk.rows = []; S.bk.err = /backups/.test(x.message||"") ? "Backups aren't set up yet. Run the latest schema.sql in Supabase (SQL Editor)." : "Could not load backups: " + (x.message||""); }
  S.bk.loading = false; if (S.tab==="backups" && !$("#ov")) render();
}
const kb = n => n > 1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1, Math.round(n/1024))+" KB";
const BK_KIND = {manual:"Manual", daily:"Daily (automatic)", "before restore":"Before restore", "before start again":"Before Start again"};
function viewBackups(){
  if (!S.isFull) return `<div class="banner">Only Admin and CFO can manage backups.</div>`;
  const B = S.bk; if (B.rows === null && !B.loading) loadBackups();
  const rows = B.rows || [], lastDaily = rows.find(r=>r.kind==="daily"), lastDl = store.get("fa.lastDownload");
  const stale = !lastDl || (Date.now() - +lastDl) > 7*864e5;
  const tr = rows.map(r => `<tr><td class="nowrap">${h(logTime(r.taken_at))}</td><td>${h(BK_KIND[r.kind]||r.kind)}</td><td>${h(r.label||"")}</td><td>${h(r.taken_by_email||"Scheduled")}</td>
     <td class="n">${nf.format(r.row_count)}</td><td class="n">${kb(r.size_bytes)}</td>
     <td class="nowrap"><button class="btn sm" data-bk="dl" data-id="${r.id}">Download</button> <button class="btn sm" data-bk="restore" data-id="${r.id}">Restore</button>${r.kind==="manual"?` <button class="btn sm danger" data-bk="del" data-id="${r.id}">Delete</button>`:""}</td></tr>`).join("");
  return `<div class="stack">
  ${stale?`<div class="banner" style="border-color:var(--warn)"><b>Keep a copy outside Supabase.</b> ${lastDl?`You last downloaded a backup on ${fmtDate(iso(new Date(+lastDl)))} on this device.`:"You haven't downloaded a backup on this device yet."} Download one at least weekly and keep it on OneDrive or Google Drive.</div>`:""}
  <div class="kpis">
    <div class="kpi"><div class="eyebrow">Last automatic backup</div><div class="v" style="font-size:20px">${lastDaily?h(logTime(lastDaily.taken_at)):"–"}</div><div class="s">Taken daily, kept 30 days</div></div>
    <div class="kpi"><div class="eyebrow">Backups stored</div><div class="v">${nf.format(rows.length)}</div><div class="s">${kb(rows.reduce((a,r)=>a+(+r.size_bytes||0),0))} in total</div></div>
    <div class="kpi"><div class="eyebrow">Last downloaded here</div><div class="v" style="font-size:20px">${lastDl?fmtDate(iso(new Date(+lastDl))):"Never"}</div></div>
  </div>
  <section class="sheet"><div class="sheet-h"><div><h2>Back up now</h2><p>A backup holds all ventures, investors, ledger, bank, expenses, suppliers and settings. Users and passwords are not included.</p></div></div>
    <div class="sheet-b row" style="flex-wrap:wrap;gap:10px">
      <button class="btn primary" data-bk="file">Download backup file</button>
      <input id="bkLabel" placeholder="Label, e.g. Before September close" style="max-width:280px"><button class="btn" data-bk="take">Save backup in Supabase</button>
    </div></section>
  <section class="sheet"><div class="sheet-h"><div><h2>Saved backups</h2><p>Restoring replaces <b>all</b> current business data with the backup. A copy of the current data is saved first, so a restore can itself be undone.</p></div><button class="btn sm" data-bk="refresh">Refresh</button></div>
    ${B.err?`<div class="sheet-b"><div class="banner">${h(B.err)}</div></div>`:""}
    <div class="tbl"><table><thead><tr><th>Taken</th><th>Type</th><th>Label</th><th>By</th><th class="n">Records</th><th class="n">Size</th><th></th></tr></thead>
      <tbody>${B.loading&&B.rows===null?`<tr><td colspan="7" class="empty">Loading…</td></tr>`:tr||`<tr><td colspan="7" class="empty">No backups yet. One is taken automatically each day.</td></tr>`}</tbody></table></div></section>
  <section class="sheet"><div class="sheet-h"><div><h2>Restore from a file</h2><p>Use a backup file downloaded from this page.</p></div></div>
    <div class="sheet-b row" style="flex-wrap:wrap;gap:10px"><input type="file" id="bkFile" accept=".json,application/json"><span class="note" id="bkFileInfo">${B.file?h(B.file.summary):""}</span>
      ${B.file?`<button class="btn danger" data-bk="restorefile">Restore this file</button>`:""}</div></section>
  </div>`;
}
async function backupRows(){
  const rows = [];
  for (let from=0;;from+=1000){ const {data, error} = await SB.from("records").select("collection,id,data").range(from, from+999); if (error) throw error; rows.push(...data); if (data.length < 1000) break; }
  return rows;
}
function backupBlob(rows, meta){
  return new Blob([JSON.stringify({app:"Future Axis ledger", format:1, base:BASE(), exportedAt:new Date().toISOString(), exportedBy:S.user?.email||"", ...meta, records:rows})], {type:"application/json"});
}
const stamp = () => { const d = new Date(); return `${iso(d)}-${pad(d.getHours())}${pad(d.getMinutes())}`; };
function confirmRestore(title, text, go){
  $("#ovHost").innerHTML = `<div class="ov" id="ov"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="rsTitle" style="width:min(560px,100%)">
    <div class="row" style="justify-content:space-between"><h2 id="rsTitle">${h(title)}</h2><button class="btn sm" data-close type="button">Close</button></div>
    <div class="stack" style="margin-top:12px"><p>${text}</p><p>All current business data will be replaced. A backup of the current data is taken first.</p>
      <div class="row"><input id="rsTxt" placeholder="Type RESTORE to confirm" style="max-width:220px"><button class="btn danger" id="rsGo">Restore</button><span class="note" id="rsMsg"></span></div></div></div></div>`;
  wireClose();
  $("#rsGo").onclick = async () => {
    if ($("#rsTxt").value.trim().toUpperCase() !== "RESTORE"){ $("#rsMsg").textContent = "Type RESTORE to confirm"; return; }
    $("#rsGo").disabled = true; $("#rsMsg").textContent = "Restoring…";
    try { const n = await go(); $("#ovHost").innerHTML = ""; S.bk.rows = null; S.bk.file = null; S.lg.rows = null; await loadAll(); render(); toast(`Restored ${n} records`); }
    catch(x){ $("#rsMsg").textContent = "Could not restore: " + (x.message||""); $("#rsGo").disabled = false; }
  };
}
async function backupAction(b){
  const a = b.dataset.bk, id = b.dataset.id;
  try {
    if (a==="refresh"){ S.bk.rows = null; return render(); }
    if (a==="file"){ b.disabled = true; const rows = await backupRows(); saveBlob(backupBlob(rows, {source:"live"}), `FutureAxis-backup-${stamp()}.json`);
      store.set("fa.lastDownload", String(Date.now())); logEvent("Backup downloaded", `${rows.length} records`); b.disabled = false; return render(); }
    if (a==="take"){ b.disabled = true; const {data, error} = await SB.rpc("take_backup", {p_kind:"manual", p_label: $("#bkLabel")?.value || null}); if (error) throw error;
      toast(`Backup #${data} saved`); S.bk.rows = null; return render(); }
    if (a==="dl"){ b.disabled = true; const {data, error} = await SB.from("backups").select("taken_at,kind,label,data").eq("id", id).maybeSingle(); if (error||!data) throw error||new Error("not found");
      saveBlob(backupBlob(data.data, {source:"backup #"+id, takenAt:data.taken_at, kind:data.kind, label:data.label||""}), `FutureAxis-backup-${id}-${iso(new Date(data.taken_at))}.json`);
      store.set("fa.lastDownload", String(Date.now())); b.disabled = false; return render(); }
    if (a==="del"){ if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "Confirm delete"; return; }
      const {error} = await SB.rpc("delete_backup", {p_id: +id}); if (error) throw error; S.bk.rows = null; toast("Backup deleted"); return render(); }
    if (a==="restore"){ const r = (S.bk.rows||[]).find(x=>String(x.id)===String(id));
      return confirmRestore("Restore backup", `Backup #${h(id)} of ${h(logTime(r?.taken_at))} (${h(BK_KIND[r?.kind]||r?.kind||"")}, ${nf.format(r?.row_count||0)} records).`,
        async () => { const {data, error} = await SB.rpc("restore_backup", {p_id: +id}); if (error) throw error; return data; }); }
    if (a==="restorefile"){ const F = S.bk.file; if (!F) return;
      return confirmRestore("Restore from file", `${h(F.name)}: ${h(F.summary)}.`,
        async () => { const {data, error} = await SB.rpc("restore_from_file", {p_rows: F.rows, p_name: F.name}); if (error) throw error; return data; }); }
  } catch(x){ b.disabled = false; toast("Could not complete: " + (x?.message||"try again")); }
}
async function readBackupFile(f){
  try { const j = JSON.parse(await f.text()); const rows = Array.isArray(j) ? j : j.records;
    if (!Array.isArray(rows) || rows.some(r => !r || !r.collection || !r.id || typeof r.data !== "object")) throw new Error("bad");
    const by = {}; rows.forEach(r => by[r.collection] = (by[r.collection]||0) + 1);
    const parts = Object.entries(by).filter(([k])=>LOG_AREA[k]).map(([k,v])=>`${v} ${LOG_AREA[k].toLowerCase()}`);
    S.bk.file = {name:f.name, rows, summary:`${rows.length} records${j.exportedAt?`, saved ${logTime(j.exportedAt)}`:""} (${parts.join(", ")})`};
  } catch(e){ S.bk.file = null; toast("That file isn't a backup from this system"); }
  render();
}

/* ---------- monthly investor report (backup control, sent automatically) ---------- */
const MR_ID = ym => "monthly-" + ym;
const prevYm = () => { const t = D(todayIso()); return iso(new Date(t.getFullYear(), t.getMonth()-1, 1)).slice(0,7); };
const mrRecipients = () => String(S.cfg.mrTo || "").split(/[,;\s]+/).map(x=>x.trim()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
function monthlyRows(ym){
  const to = monthEnd(ym), from = ym + "-01", cur = BASE(), f = conv(1, VIEW(), cur), rows = [];
  for (const p of S.pl){
    if (!p.date || p.date > to || isOwnName(p.investor)) continue;
    const L = S.led.filter(t=>t.placementId===p.id && t.date<=to);
    const repaid = L.filter(t=>t.type==="Investor Capital Repaid").reduce((s,t)=>s+num(t.amount),0)*f;
    const acc = L.filter(t=>t.type==="Investor Profit Accrued"), paid = L.filter(t=>t.type==="Investor Profit Paid").reduce((s,t)=>s+num(t.amount),0)*f;
    const month = acc.filter(t=>t.date>=from).reduce((s,t)=>s+num(t.amount),0)*f, todate = acc.reduce((s,t)=>s+num(t.amount),0)*f;
    const amount = num(p.amount)*f - repaid;
    if (amount < 0.005 && !month) continue;
    rows.push({cur: invCur(p), code:p.code||"", investor:p.investor||"", venture: p.bizId ? bizName(p.bizId) : "", date:p.date, maturity:p.maturity||"", amount, rate:num(p.rate), month, todate, paid, payable: todate - paid});
  }
  return rows.sort((a,b)=>a.investor.localeCompare(b.investor) || String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
}
function monthlyByInvestor(rows){
  const by = {};
  for (const r of rows){ const x = by[r.investor] ||= {investor:r.investor, cur:r.cur, n:0, amount:0, rw:0, month:0, todate:0, paid:0, payable:0};
    x.n++; x.amount += r.amount; x.rw += r.amount*r.rate; x.month += r.month; x.todate += r.todate; x.paid += r.paid; x.payable += r.payable; }
  return Object.values(by).map(x=>({...x, rate: div(x.rw, x.amount)})).sort((a,b)=>b.amount-a.amount);
}
function monthlyTotals(rows){

/* ---------- payment details and receipts (full record of every payment) ---------- */
const RCPT_BUCKET = "receipts", RCPT_MAX = 10*1024*1024;
const kbs = n => n > 1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1, Math.round(n/1024))+" KB";
const safeName = s => String(s).normalize("NFKD").replace(/[^\w.\-]+/g,"_").slice(-80);
async function uploadReceipts(col, id, files){
  const out = [];
  for (const f of files){
    if (f.size > RCPT_MAX) throw new Error(`${f.name} is larger than 10 MB`);
    const path = `${col}/${id}/${Date.now()}-${safeName(f.name)}`;
    const {error} = await SB.storage.from(RCPT_BUCKET).upload(path, f, {contentType: f.type || "application/octet-stream", upsert:false});
    if (error) throw new Error(/bucket|not.?found/i.test(error.message||"") ? "Receipt storage isn't set up yet. Run the latest schema.sql in Supabase." : "Receipt upload failed: " + (error.message||""));
    out.push({path, name:f.name, size:f.size, type:f.type||"", at:new Date().toISOString(), by:S.user?.email||""});
  }
  if (out.length) logEvent("Receipt uploaded", `${out.length} file${out.length===1?"":"s"} · ${col}`);
  return out;
}
async function openReceipt(path){
  const w = window.open("", "_blank");
  const {data, error} = await SB.storage.from(RCPT_BUCKET).createSignedUrl(path, 600);
  if (error || !data?.signedUrl){ if (w) w.close(); toast("Could not open the receipt: " + (error?.message || "")); return; }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

/* ---------- generic interactive charts: stacked columns (+ lines) and stacked areas ---------- */
/* cols: [{label, title, v:{key:value}, tip:[[label,value]] }]; series: [{k, l, c, type:"bar"|"line"}] */
function colChart(cols, series, opt={}){
  if (!cols.length || !cols.some(c=>series.some(s=>Math.abs(c.v[s.k]||0) >= 0.5))) return `<p class="note">${opt.empty || "Nothing to show yet."}</p>`;
